            "alt": "Yi"
      }
];

    const tileClasses = ["tile tile--large", "tile", "tile", "tile tile--wide", "tile"];
    const fallbackNpcImages = [
      { src: "https://firebasestorage.googleapis.com/v0/b/rugatha-87e15.firebasestorage.app/o/public-images%2Fnpcs%2Fenelmor-arylith%2Fthumb-0a3fe66f.webp?alt=media", alt: "Enelmor Arylith" },
      { src: "https://firebasestorage.googleapis.com/v0/b/rugatha-87e15.firebasestorage.app/o/public-images%2Fnpcs%2Fmaribel-muddlewick%2Fthumb-5a520ec7.webp?alt=media", alt: "Maribel Muddlewick" },
      { src: "https://firebasestorage.googleapis.com/v0/b/rugatha-87e15.firebasestorage.app/o/public-images%2Fnpcs%2Fharrel-mizel%2Fthumb-97c395f1.webp?alt=media", alt: "Harrel Mizel" },
      { src: "https://firebasestorage.googleapis.com/v0/b/rugatha-87e15.firebasestorage.app/o/public-images%2Fnpcs%2Flaura-fishburne%2Fthumb-d5c4f703.webp?alt=media", alt: "Laura Fishburne" },
      { src: "https://firebasestorage.googleapis.com/v0/b/rugatha-87e15.firebasestorage.app/o/public-images%2Fnpcs%2Fdr-crow-review-round2%2Fthumb-402738c3.webp?alt=media", alt: "Dr. Crow" }
    ];

    const shuffle = (items) => {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    };

    const renderCollage = (target, images) => {
      if (!target || images.length < tileClasses.length) return;
      target.replaceChildren(...images.slice(0, tileClasses.length).map((image, index) => {
        const img = document.createElement("img");
        img.className = tileClasses[index];
        img.src = image.src;
        img.alt = "";
        img.loading = "eager";
        img.decoding = "async";
        return img;
      }));
    };

    const applyLanguage = (lang) => {
      document.documentElement.lang = lang === "en" ? "en" : "zh-Hant";
      document.body.dataset.lang = lang;
      document.title = lang === "en" ? "Characters | Rugatha" : "角色總覽 | Rugatha";
      document.querySelectorAll("[data-i18n]").forEach((node) => {
        node.textContent = node.dataset[lang] || node.textContent;
      });
      document.querySelectorAll("[data-lang-option]").forEach((button) => {
        button.dataset.langOption = lang;
        button.classList.add("is-active");
        button.setAttribute("aria-pressed", "true");
        button.setAttribute("aria-label", lang === "en" ? "目前語言：English" : "目前語言：中文");
        window.RugathaLanguageToggle?.setButtonIcon(button, lang);
      });
      try {
        localStorage.setItem("characters-lang", lang);
      } catch (_) {
        // Storage may be unavailable in private browsing contexts.
      }
    };

    const getInitialLanguage = () => {
      try {
        const stored = localStorage.getItem("characters-lang");
        if (stored === "zh" || stored === "en") return stored;
      } catch (_) {
        // Ignore storage access errors.
      }
      return navigator.language && navigator.language.toLowerCase().startsWith("en") ? "en" : "zh";
    };

    renderCollage(
      document.querySelector('[data-collage="pc"]'),
      shuffle(PC_IMAGES)
    );

    fetch("../npc/data/characters.json?v=20261025-portraits-v2", { cache: "no-store" })
      .then((response) => response.ok ? response.json() : Promise.reject(new Error("NPC data failed")))
      .then((characters) => {
        const images = characters
          .filter((character) => character.imageThumb || character.image)
          .map((character) => {
            const image = character.imageThumb || character.image;
            return {
              src: /^https?:|^\//i.test(image)
                ? image
                : `../npc/${image.split("/").map(encodeURIComponent).join("/")}`,
              alt: character.nameEn || character.nameZh || character.id || ""
            };
          });
        renderCollage(document.querySelector('[data-collage="npc"]'), shuffle(images));
      })
      .catch(() => {
        renderCollage(document.querySelector('[data-collage="npc"]'), fallbackNpcImages);
      });

    document.querySelectorAll("[data-lang-option]").forEach((button) => {
      button.addEventListener("click", () => applyLanguage(button.dataset.langOption === "en" ? "zh" : "en"));
    });
    applyLanguage(getInitialLanguage());
