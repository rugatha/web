</head><body data-pc-name="Anedak"><main class="page" id="app"><div class="topbar"><a class="back-link" id="back-link" href="../index.html">返回角色總覽</a><div class="language-toggle" role="group" aria-label="Language"><button type="button" data-lang="zh" aria-pressed="true" aria-label="目前語言：中文" data-lang-toggle></button></div></div><section class="hero"><div class="portrait" id="portrait"></div><div><p class="eyebrow" id="page-eyebrow">玩家角色</p><h1 class="title" id="page-title">Anedak</h1><p class="subtitle" id="page-subtitle"></p></div></section><section class="meta-grid"><article class="meta-card"><p class="meta-label" id="race-label">種族</p><p class="meta-value" id="race-value"></p></article><article class="meta-card"><p class="meta-label" id="role-label">職業</p><p class="meta-value" id="role-value"></p></article></section><section class="section adventure-log"><h2 id="adventure-log-title">冒險紀錄</h2><div class="adventure-log__body" id="adventure-log-body"><p>安納戴克在麥克嵩篇後段加入主線，與隊伍一起進入王城上流社交圈，調查拉茲特獸、闇影之父與瑟巴諾相關線索。他在地下行動中面對火勢、爆炸與闇影之父造成的危機，曾身受重傷，由帕拉丁以治療法術救回；後來又被捲入角鬥士比武大會與麥丁頓王國的政治餘波。</p><p>比武大會慘劇後，安納戴克與家亨、雷米離去後沒有回來。雷米後來宣稱三人遭到惡徒圍毆，只有自己逃出。隊伍沿城牆西北方找到安納戴克與家亨的遺體：安納戴克的身體被斬首，左手將家亨的頭按置在地上。眾人挖墓後將他與家亨安葬。</p></div></section><section class="section"><h2 id="appearances-title">登場故事弧與章節</h2><div class="arc-list" id="appearance-list"></div></section></main>
