</head><body data-pc-name="Ubbo"><main class="page" id="app"><div class="topbar"><a class="back-link" id="back-link" href="../index.html">返回角色總覽</a><div class="language-toggle" role="group" aria-label="Language"><button type="button" data-lang="zh" aria-pressed="true" aria-label="目前語言：中文" data-lang-toggle></button></div></div><section class="hero"><div class="portrait" id="portrait"></div><div><p class="eyebrow" id="page-eyebrow">玩家角色</p><h1 class="title" id="page-title">Ubbo</h1><p class="subtitle" id="page-subtitle"></p></div></section><section class="meta-grid"><article class="meta-card"><p class="meta-label" id="race-label">種族</p><p class="meta-value" id="race-value"></p></article><article class="meta-card"><p class="meta-label" id="role-label">職業</p><p class="meta-value" id="role-value"></p></article></section><section class="section adventure-log"><h2 id="adventure-log-title">冒險紀錄</h2><div class="adventure-log__body" id="adventure-log-body"><p>烏波在卓茲蘭之穴篇加入冒險團隊，與 GoR、庫登、羅特、賽柏等人接觸孽物、芬諾爾傳道者與羽王。覆羽莊園後，他依循直覺，與羅特、賽柏花了一個月前往自己的出生地；抵達前，GoR 在守夜時沒有留下訊息便消失。</p><p>在斐納札，烏波被唐歡迎回家，卻察覺關於出生地的記憶像是被植入腦中。他以單音節化名「波」行動，會自然跟隨鐘聲跪下，也熟悉月神禱詞。夢中，他得到芬諾爾神諭與新的能力。</p><p>派琶預示篇中，烏波協助將物資送入常翠林總部，嘗試以草藥工具喚醒沉睡的賽柏，並在芒果襲擊時化為火元素迎戰蛇妖與巨蛇。</p></div></section><section class="section"><h2 id="appearances-title">登場故事弧與章節</h2><div class="arc-list" id="appearance-list"></div></section></main>
