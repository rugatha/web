    <section class="section adventure-log"><h2 id="adventure-log-title">冒險紀錄</h2><div class="adventure-log__body" id="adventure-log-body"><p>烏柯在沃瓦倫加入台北市議員，以德魯伊的經驗帶領隊伍穿越嚎叫森林，並在路邊讀出德魯伊語留下的訊息。狼群襲擊中，他與同伴經歷瀕死與復甦。沃瓦倫儀式失控時，他化身動物，背起倒地的薩梅爾與 YHWH，與其他倖存者衝入寂靜殿。</p><p>進入地下城後，烏柯與家亨、烏犧奧泥一同聽見多姆尼爾的呼喚。他協助被囚的崔夏，並在背著她前進時，讓神秘石頭融入崔夏體內。後來崔夏因拉索斯教威脅父母而決定回去面對危機，烏柯選擇跟隨她離開隊伍。</p></div></section><section class="section">
