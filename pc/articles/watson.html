</head><body data-pc-name="Watson"><main class="page" id="app"><div class="topbar"><a class="back-link" id="back-link" href="../index.html">返回角色總覽</a><div class="language-toggle" role="group" aria-label="Language"><button type="button" data-lang="zh" aria-pressed="true" aria-label="目前語言：中文" data-lang-toggle></button></div></div><section class="hero"><div class="portrait" id="portrait"></div><div><p class="eyebrow" id="page-eyebrow">玩家角色</p><h1 class="title" id="page-title">Watson</h1><p class="subtitle" id="page-subtitle"></p></div></section><section class="meta-grid"><article class="meta-card"><p class="meta-label" id="race-label">種族</p><p class="meta-value" id="race-value"></p></article><article class="meta-card"><p class="meta-label" id="role-label">職業</p><p class="meta-value" id="role-value"></p></article></section><section class="section adventure-log"><h2 id="adventure-log-title">冒險紀錄</h2><div class="adventure-log__body" id="adventure-log-body"><p>華生在麥丁頓破碎篇登場，與帕拉丁、蘇加魯、圖伊特、墜兒等在惡棍之城瑟巴諾成為夥伴。她在交易與真實形態的旅程中接觸霍布、深淵復活者與被詛咒的倖存者；阿爾芬諾之禮中，她以化名露西亞小姐接觸貴族，也在舊城區見到母親大人，得知貧民窟居民受到她幫助。</p><p>在潘蜜拉家與伯納德相關的調查中，華生與同伴發現母親大人的臥房裡有巨型繭，並在門口發現伯納德乾枯的屍體。暴民放火後，華生抱起伯納德，與扛著圖伊特的蘇加魯、帕拉丁趁機逃走。後續她在來到洛森王國後，因戴上月光狩獵會的面具，而消失不見，只留下她的懷錶。</p></div></section><section class="section"><h2 id="appearances-title">登場故事弧與章節</h2><div class="arc-list" id="appearance-list"></div></section></main>
