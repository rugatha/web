</head><body data-pc-name="Brown"><main class="page" id="app"><div class="topbar"><a class="back-link" id="back-link" href="../index.html">返回角色總覽</a><div class="language-toggle" role="group" aria-label="Language"><button type="button" data-lang="zh" aria-pressed="true" aria-label="目前語言：中文" data-lang-toggle></button></div></div><section class="hero"><div class="portrait" id="portrait"></div><div><p class="eyebrow" id="page-eyebrow">玩家角色</p><h1 class="title" id="page-title">Brown</h1><p class="subtitle" id="page-subtitle"></p></div></section><section class="meta-grid"><article class="meta-card"><p class="meta-label" id="race-label">種族</p><p class="meta-value" id="race-value"></p></article><article class="meta-card"><p class="meta-label" id="role-label">職業</p><p class="meta-value" id="role-value"></p></article></section><section class="section adventure-log"><h2 id="adventure-log-title">冒險紀錄</h2><div class="adventure-log__body" id="adventure-log-body"><p>布朗的冒險從接受溫德家的護衛委託開始。他計畫護送溫德一家穿越森林，但聽見「殺了溫德」的低語，也遇上失蹤又回來的巴哥犬瑪芬先生。</p><p>獨自抵達魏斯科後，他在酒館被梅莉與瑪蒂達下藥，醒來時被扔進服從神社地下室，四周坐滿乾枯屍骨。</p><p>為了找回瑪芬先生，布朗追查梅莉、瑪蒂達與黑蓮花，並在服從神社地下室經歷受洗。他在無限黑暗中失去部分記憶，又被卡魯神父告知自己將走上拉索斯之路。離開魏斯科後，他用黑蓮花花瓣換得馬匹，前往夏庭森途中認識魔術師羅納德，並確認瑪芬先生能變成野狼。</p></div></section><section class="section"><h2 id="appearances-title">登場故事弧與章節</h2><div class="arc-list" id="appearance-list"></div></section></main>
