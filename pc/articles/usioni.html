    <section class="section adventure-log"><h2 id="adventure-log-title">冒險紀錄</h2><div class="adventure-log__body" id="adventure-log-body"><p>烏犧奧泥在沃瓦倫與台北市議員相遇，參與調查山米克死亡與沃瓦倫詛咒，拜訪鎮長家、寂靜殿與魏斯科。穿越嚎叫森林時，他與同伴吃下有毒三明治，遭遇狼群襲擊，並看見部分成員死亡後又復甦的異常狀況。</p><p>眾人帶回葛蘭倫大法師後，沃瓦倫的驅咒儀式變成屠殺。烏犧奧泥與倖存者進入寂靜殿地下城，並與家亨、烏柯一同聽見多姆尼爾的聲音，被要求在冒險團中完成玩笑。烏犧奧泥在地下城中將被俘虜的哥布林加冕為「地底王神王尼可」。</p><p>寇林菲爾德後，隊伍前往麥克嵩途中，烏犧奧泥悄悄帶著神王尼可跳下馬車，與其他夥伴暫時告別。</p></div></section><section class="section">
