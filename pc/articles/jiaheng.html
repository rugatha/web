  <main class="page" id="app"><div class="topbar"><a class="back-link" id="back-link" href="../index.html">返回角色總覽</a><div class="language-toggle" role="group" aria-label="Language"><button type="button" data-lang="zh" aria-pressed="true" aria-label="目前語言：中文" data-lang-toggle></button></div></div><section class="hero"><div class="portrait" id="portrait"></div><div><p class="eyebrow" id="page-eyebrow">玩家角色</p><h1 class="title" id="page-title">Jiaheng</h1><p class="subtitle" id="page-subtitle"></p></div></section><section class="meta-grid"><article class="meta-card"><p class="meta-label" id="race-label">種族</p><p class="meta-value" id="race-value"></p></article><article class="meta-card"><p class="meta-label" id="role-label">職業</p><p class="meta-value" id="role-value"></p></article></section><section class="section adventure-log"><h2 id="adventure-log-title">冒險紀錄</h2><div class="adventure-log__body" id="adventure-log-body"><p>家亨在沃瓦倫加入台北市議員，參與詛咒調查、魏斯科之行與嚎叫森林行軍。他曾因潔絲敏準備的三明治中毒，也在狼群戰鬥中經歷死亡與復甦。沃瓦倫毀滅後，他隨倖存者進入寂靜殿地下城，並與烏柯、烏犧奧泥一同聽見多姆尼爾的聲音。</p><p>在麥克嵩，家亨被士兵帶走，直到帕拉丁贏得王宮花園比武大會、要求釋放同伴後，才從角鬥士處境中脫身並與隊友重逢。比武大會慘劇後，他與安納戴克、雷米離去後未歸；雷米後來帶回消息，說家亨與安納戴克被殺。眾人沿城牆找到家亨被斬首的遺體，他的右手將安納戴克的頭按在地上。隊伍挖墓後將他安葬。</p></div></section><section class="section"><h2 id="appearances-title">登場故事弧與章節</h2><div class="arc-list" id="appearance-list"></div></section></main>
