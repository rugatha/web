<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>D&D 法術表 | Rugatha</title>
  <link rel="icon" type="image/png" href="../../assets/logo/rugatha-favicon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/logo/rugatha-favicon-32.png">
  <link rel="stylesheet" href="../../shared/styles/theme.css">
  <script src="../../shared/language-toggle.js"></script>
  <style>
    :root {
      --spell-bg: var(--bg);
      --spell-ink: #1f2a24;
      --spell-muted: #d1ded6;
      --spell-table-muted: #607066;
      --spell-line: rgba(68, 95, 86, 0.24);
      --spell-panel: #eef3ea;
      --spell-panel-alt: #e5ede4;
      --spell-panel-strong: #d3dfd2;
      --spell-accent: #3f7d69;
      --spell-accent-dark: #244f43;
      --spell-focus: #c58b46;
      --spell-gold-soft: #ead7ad;
    }

    [hidden] {
      display: none !important;
    }

    body {
      background: var(--spell-bg);
      color: var(--spell-ink);
    }

    .language-toggle {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      display: inline-flex;
    }

    .language-toggle button {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
    }

    .language-toggle button:hover,
    .language-toggle button:focus-visible {
      background: transparent;
      opacity: 0.86;
      transform: translateY(-1px);
    }

    .language-toggle__icon {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .page {
      min-height: 100vh;
    }

    .banner {
      margin: 20px 0 10px;
    }

    .spells-shell {
      width: min(1480px, calc(100vw - 28px));
      margin: 0 auto 40px;
    }

    .title-bar {
      display: grid;
      justify-items: center;
      gap: 12px;
      padding: 18px 0 14px;
      text-align: center;
      color: var(--text);
      border-bottom: 1px solid rgba(236, 242, 237, 0.28);
    }

    .title-copy {
      display: grid;
      justify-items: center;
    }

    .title-copy h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.8rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .title-copy p {
      max-width: 680px;
      margin: 10px auto 0;
      color: var(--spell-muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    .title-divider {
      width: min(320px, 72vw);
      height: 1px;
      margin: 12px auto 2px;
      border: 0;
      background: rgba(236, 242, 237, 0.32);
    }

    .result-count {
      min-width: 0;
      text-align: center;
      color: var(--spell-muted);
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .view-toggle {
      display: inline-grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
      margin: 16px 0 0;
      border: 1px solid rgba(236, 242, 237, 0.28);
      border-radius: 8px;
      background: rgba(19, 28, 32, 0.22);
    }

    .view-toggle button {
      min-height: 36px;
      padding: 0 14px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
    }

    .view-toggle button[aria-pressed="true"] {
      background: var(--accent);
      color: #10231d;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1.5fr) repeat(5, minmax(120px, 1fr)) auto;
      gap: 10px;
      align-items: end;
      padding: 16px 0;
      border-bottom: 1px solid rgba(236, 242, 237, 0.28);
    }

    .control {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .control label,
    .control-label {
      color: var(--spell-muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0;
    }

    input,
    select,
    button {
      min-height: 42px;
      border: 1px solid var(--spell-line);
      border-radius: 6px;
      background: var(--spell-panel);
      color: var(--spell-ink);
      font: inherit;
    }

    input,
    select {
      width: 100%;
      padding: 0 11px;
    }

    .component-toggle {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 42px;
      align-items: center;
    }

    .component-toggle button {
      min-width: 42px;
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid var(--spell-line);
      border-radius: 999px;
      background: rgba(238, 243, 234, 0.82);
      color: var(--spell-ink);
      font-size: 0.92rem;
      font-weight: 700;
    }

    .component-toggle button[aria-pressed="true"] {
      background: var(--accent);
      color: #10231d;
      border-color: var(--accent);
    }

    input:focus,
    select:focus,
    button:focus-visible {
      outline: 3px solid rgba(179, 95, 43, 0.26);
      border-color: var(--spell-focus);
    }

    button {
      padding: 0 14px;
      cursor: pointer;
      font-weight: 700;
      background: var(--spell-accent);
      color: #fffaf0;
      border-color: var(--spell-accent);
    }

    button:hover {
      background: var(--spell-accent-dark);
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--spell-line);
      border-radius: 8px;
      background: var(--spell-panel);
      box-shadow: 0 18px 42px rgba(18, 29, 25, 0.24);
    }

    table {
      width: 100%;
      min-width: 1180px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      border-bottom: 1px solid var(--spell-line);
      padding: 10px 11px;
      vertical-align: top;
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--spell-panel-strong);
      color: #203b33;
      font-size: 0.82rem;
      line-height: 1.2;
      white-space: nowrap;
    }

    th button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      min-height: 28px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    th button:hover {
      background: transparent;
      color: var(--spell-accent-dark);
    }

    .spell-row:nth-of-type(4n + 1) {
      background: rgba(255, 255, 255, 0.22);
    }

    .spell-row:hover {
      background: rgba(63, 125, 105, 0.16);
    }

    .col-level {
      width: 76px;
    }

    .col-school {
      width: 150px;
    }

    .col-name {
      width: 210px;
    }

    .col-time {
      width: 130px;
    }

    .col-range {
      width: 130px;
    }

    .col-duration {
      width: 150px;
    }

    .col-components {
      width: 110px;
    }

    .col-concentration,
    .col-ritual {
      width: 96px;
    }

    .col-attack,
    .col-save,
    .col-damage {
      width: 120px;
    }

    .col-detail {
      width: 80px;
    }

    .col-book {
      width: 96px;
    }

    .name-cell {
      display: grid;
      gap: 3px;
    }

    .name-zh {
      font-weight: 800;
      line-height: 1.25;
      color: #17382f;
    }

    .name-en {
      color: var(--spell-table-muted);
      font-size: 0.82rem;
      line-height: 1.25;
    }

    body[data-lang="en"] .name-en {
      order: -1;
      color: #17382f;
      font-size: 1rem;
      font-weight: 800;
    }

    body[data-lang="en"] .name-zh {
      color: var(--spell-table-muted);
      font-size: 0.82rem;
      font-weight: 400;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(63, 125, 105, 0.14);
      color: #25463c;
      font-size: 0.8rem;
      line-height: 1.2;
      white-space: nowrap;
      border: 1px solid rgba(63, 125, 105, 0.16);
    }

    .detail-button {
      min-height: 32px;
      padding: 0 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.24);
      color: var(--spell-accent-dark);
      border-color: rgba(63, 125, 105, 0.35);
    }

    .detail-button:hover {
      color: #fffaf0;
      background: var(--spell-accent-dark);
    }

    .book-button,
    .remove-button,
    .clear-button {
      min-height: 32px;
      padding: 0 10px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .book-button[disabled] {
      cursor: default;
      background: rgba(63, 125, 105, 0.16);
      color: var(--spell-table-muted);
      border-color: rgba(63, 125, 105, 0.16);
    }

    .remove-button,
    .clear-button {
      background: #8c4c37;
      border-color: #8c4c37;
      color: #fffaf0;
    }

    .remove-button:hover,
    .clear-button:hover {
      background: #683728;
    }

    .detail-row[hidden] {
      display: none;
    }

    .detail-row > td {
      background: var(--spell-panel);
    }

    .detail-panel {
      display: grid;
      gap: 12px;
      padding: 14px 12px 10px;
      line-height: 1.65;
      color: #27251f;
      background: var(--spell-panel);
      border-left: 4px solid var(--spell-accent);
    }

    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .mobile-detail-meta {
      display: none;
    }

    .mobile-detail-actions {
      display: none;
    }

    .detail-text {
      display: grid;
      gap: 10px;
      max-width: 980px;
    }

    .detail-text p,
    .detail-text ul,
    .detail-text table {
      margin: 0;
    }

    .detail-text ul {
      padding-left: 1.2rem;
    }

    .detail-text table {
      width: 100%;
      min-width: 0;
      table-layout: auto;
      border: 1px solid var(--spell-line);
      background: rgba(255, 255, 255, 0.28);
    }

    .detail-text table th,
    .detail-text table td {
      position: static;
      padding: 7px 8px;
      font-size: 0.92rem;
    }

    .detail-text table th {
      background: var(--spell-panel-strong);
    }

    .empty-state,
    .load-state {
      padding: 28px;
      color: var(--spell-muted);
      text-align: center;
    }

    .error-state {
      padding: 18px;
      border: 1px solid #b35f2b;
      border-radius: 8px;
      background: #fff1e4;
      color: #6d3218;
      line-height: 1.6;
    }

    .class-view {
      display: grid;
      gap: 18px;
      margin-top: 16px;
    }

    .class-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
      align-items: start;
    }

    .class-card {
      display: grid;
      gap: 12px;
      align-content: start;
      border: 1px solid var(--spell-line);
      border-radius: 8px;
      background: var(--spell-panel);
      box-shadow: 0 14px 34px rgba(18, 29, 25, 0.18);
      overflow: hidden;
    }

    .class-card.is-collapsed {
      gap: 0;
    }

    .class-card h2 {
      margin: 0;
      background: var(--spell-panel-strong);
    }

    .class-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      min-height: 52px;
      padding: 12px 14px;
      border: 0;
      border-radius: 0;
      background: var(--spell-panel-strong);
      color: #17382f;
      font-size: 1.25rem;
      letter-spacing: 0;
      text-align: left;
    }

    .class-toggle:hover {
      background: #c7d8c7;
      color: #17382f;
    }

    .class-toggle-label {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }

    .class-toggle-label small {
      color: var(--spell-table-muted);
      font-size: 0.92rem;
    }

    .class-toggle-state {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 1px solid rgba(63, 125, 105, 0.28);
      border-radius: 999px;
      background: rgba(238, 243, 234, 0.72);
    }

    .class-toggle-state::before {
      content: "";
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
    }

    .class-toggle-state.is-collapse::before {
      border-top: 8px solid var(--spell-accent-dark);
    }

    .class-toggle-state.is-expand::before {
      border-bottom: 8px solid var(--spell-accent-dark);
    }

    .level-groups {
      display: grid;
      gap: 10px;
      padding: 0 14px 14px;
    }

    .class-spell-overview {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--spell-line);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.38);
    }

    .class-spell-overview h3 {
      margin: 0;
      color: #244f43;
      font-size: 1rem;
    }

    .class-spell-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 0;
    }

    .class-spell-summary div {
      min-width: 0;
      padding: 8px;
      border-radius: 5px;
      background: rgba(63, 125, 105, 0.1);
    }

    .class-spell-summary dt {
      color: var(--spell-table-muted);
      font-size: 0.76rem;
      font-weight: 700;
    }

    .class-spell-summary dd {
      margin: 3px 0 0;
      color: #17382f;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .level-group {
      display: grid;
      gap: 6px;
      padding-top: 10px;
      border-top: 1px solid var(--spell-line);
    }

    .level-group:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .level-group h3 {
      margin: 0;
      color: #244f43;
      font-size: 0.95rem;
      letter-spacing: 0;
    }

    .class-spell-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .class-spell-list li {
      display: inline-flex;
      max-width: 100%;
    }

    .class-spell-button {
      display: inline-flex;
      gap: 4px;
      align-items: baseline;
      min-height: 0;
      max-width: 100%;
      padding: 4px 8px;
      border: 1px solid rgba(63, 125, 105, 0.16);
      border-radius: 999px;
      background: rgba(63, 125, 105, 0.14);
      color: #25463c;
      font-size: 0.85rem;
      line-height: 1.25;
      font-weight: 600;
    }

    .class-spell-button:hover,
    .class-spell-button[aria-expanded="true"] {
      background: var(--spell-accent-dark);
      color: #eef3ea;
      border-color: var(--spell-accent-dark);
    }

    .class-spell-button small {
      color: var(--spell-table-muted);
      font-size: 0.75rem;
    }

    .class-spell-button:hover small,
    .class-spell-button[aria-expanded="true"] small {
      color: rgba(238, 243, 234, 0.76);
    }

    body[data-lang="en"] .class-spell-button small {
      order: -1;
      color: inherit;
      font-size: 0.85rem;
      font-weight: 600;
    }

    body[data-lang="en"] .class-spell-button span {
      color: var(--spell-table-muted);
      font-size: 0.75rem;
      font-weight: 400;
    }

    body[data-lang="en"] .class-spell-button:hover small,
    body[data-lang="en"] .class-spell-button[aria-expanded="true"] small {
      color: #eef3ea;
    }

    body[data-lang="en"] .class-spell-button:hover span,
    body[data-lang="en"] .class-spell-button[aria-expanded="true"] span {
      color: rgba(238, 243, 234, 0.76);
    }

    .class-spell-detail {
      display: grid;
      gap: 10px;
      margin-top: 2px;
      padding: 12px;
      border-left: 4px solid var(--spell-accent);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.42);
      color: #27251f;
      line-height: 1.62;
    }

    .class-spell-detail h4 {
      margin: 0;
      color: #17382f;
      font-size: 1rem;
      letter-spacing: 0;
    }

    .class-spell-detail .detail-text {
      max-width: none;
    }

    .book-view {
      display: grid;
      gap: 14px;
      margin-top: 16px;
    }

    .book-tools {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 10px;
      align-items: end;
      padding: 12px;
      border: 1px solid var(--spell-line);
      border-radius: 8px;
      background: var(--spell-panel);
    }

    .book-search-results {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 32px;
      padding: 0 12px;
    }

    .book-list {
      display: grid;
      gap: 12px;
    }

    .book-card {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--spell-line);
      border-left: 4px solid var(--spell-accent);
      border-radius: 8px;
      background: var(--spell-panel);
      box-shadow: 0 14px 34px rgba(18, 29, 25, 0.18);
    }

    .book-card-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
    }

    .book-card h2 {
      display: grid;
      gap: 2px;
      margin: 0;
      color: #17382f;
      font-size: 1.25rem;
      letter-spacing: 0;
    }

    .book-card small {
      display: block;
      margin-top: 2px;
      color: var(--spell-table-muted);
      font-size: 0.85rem;
    }

    body[data-lang="en"] .book-card h2 .name-en {
      order: -1;
      font-size: 1.25rem;
    }

    body[data-lang="en"] .book-card h2 .name-zh {
      font-size: 0.85rem;
    }

    .mobile-label {
      display: none;
    }

    @media (max-width: 1080px) {
      .toolbar {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .toolbar .control:first-child {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 720px) {
      .spells-shell {
        width: min(100vw - 20px, 1480px);
        margin-bottom: 24px;
      }

      .title-bar {
        display: grid;
        align-items: start;
        gap: 12px;
        padding-top: 10px;
      }

      .result-count {
        text-align: left;
      }

      .view-toggle {
        width: 100%;
      }

      .toolbar {
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 12px 0;
      }

      .table-wrap {
        overflow: visible;
        border: 0;
        border-radius: 6px;
        background: transparent;
        box-shadow: none;
      }

      table,
      thead,
      tbody,
      tr,
      td {
        display: block;
        width: 100%;
        min-width: 0;
      }

      table {
        table-layout: auto;
        border-collapse: separate;
      }

      thead {
        display: none;
      }

      .spell-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        column-gap: 10px;
        row-gap: 0;
        align-items: center;
        margin-bottom: 10px;
        padding: 12px;
        border: 1px solid var(--spell-line);
        border-radius: 8px;
        background: var(--spell-panel);
        box-shadow: 0 10px 24px rgba(18, 29, 25, 0.16);
      }

      .spell-row:nth-of-type(4n + 1) {
        background: var(--spell-panel);
      }

      .spell-row:hover {
        background: var(--spell-panel);
      }

      .spell-row td {
        display: none;
      }

      .spell-row td.cell-name,
      .spell-row td.cell-detail {
        display: grid;
        grid-template-columns: 5.5em minmax(0, 1fr);
        gap: 8px;
        align-items: start;
        padding: 0;
        border-bottom: 0;
      }

      .spell-row td::before {
        content: attr(data-label);
        color: var(--spell-table-muted);
        font-size: 0.78rem;
        font-weight: 700;
        line-height: 1.5;
      }

      .spell-row td.cell-detail {
        justify-self: end;
        grid-template-columns: 1fr;
      }

      .spell-row td.cell-detail::before {
        display: none;
      }

      .spell-row td.cell-name {
        order: -1;
        grid-template-columns: 1fr;
      }

      .spell-row td.cell-name::before {
        display: none;
      }

<body>
  <div class="language-toggle" role="group" aria-label="Language">
    <button type="button" data-lang="zh" aria-pressed="true" aria-label="目前語言：中文" data-lang-toggle></button>
  </div>
  <div class="page">
    <header class="banner" aria-label="Rugatha banner image">
      <a href="../../index.html" class="banner-link" aria-label="Back to Rugatha home">
        <img src="../../assets/banner/rugatha-banner-trademark.png" alt="Rugatha banner" class="banner-logo" loading="lazy">
      </a>
    </header>

    <main class="spells-shell">
      <section class="title-bar">
        <div class="title-copy">
          <h1 data-i18n="title">D&D 法術表</h1>
          <p data-i18n="intro">採用D&amp;D 5e玩家手冊內容<br>僅供遊玩使用，請勿外流</p>
          <hr class="title-divider" aria-hidden="true">
          <p data-i18n="bookIntro">可將會使用到的法術按下「加入」<br>一併在「法術書」裡檢視</p>
          <div class="view-toggle" aria-label="切換法術視圖">
            <button type="button" data-view="list" aria-pressed="true" data-i18n="listView">法術清單</button>
            <button type="button" data-view="class" aria-pressed="false" data-i18n="classView">職業法術</button>
            <button type="button" data-view="book" aria-pressed="false" data-i18n="bookView">法術書</button>
          </div>
        </div>
        <div class="result-count" id="resultCount">載入中</div>
      </section>

      <section class="toolbar" id="filterToolbar" aria-label="法術篩選工具">
        <div class="control">
          <label for="searchInput" data-i18n="search">搜尋</label>
          <input id="searchInput" type="search" placeholder="法術名稱、英文、內容、材料" data-i18n-placeholder="searchPlaceholder">
        </div>
        <div class="control">
          <label for="levelFilter" data-i18n="level">等級</label>
          <select id="levelFilter">
            <option value="" data-i18n="all">全部</option>

        </div>
        <div class="control">
          <label for="schoolFilter" data-i18n="school">學派</label>
          <select id="schoolFilter">
            <option value="" data-i18n="all">全部</option>
          </select>
        </div>
        <div class="control">
          <span class="control-label" data-i18n="components">成分</span>
          <div class="component-toggle" id="componentFilter" aria-label="成分篩選">
            <button type="button" value="v" aria-pressed="false" data-i18n="verbal">聲</button>
            <button type="button" value="s" aria-pressed="false" data-i18n="somatic">勢</button>
            <button type="button" value="m" aria-pressed="false" data-i18n="material">材</button>

        <div class="control">
          <label for="damageFilter" data-i18n="damage">傷害</label>

        <div class="control">
          <label for="saveFilter" data-i18n="save">豁免</label>

              <th class="col-ritual"><button type="button" data-sort="ritualText"><span data-i18n="ritual">儀式</span> <span aria-hidden="true"></span></button></th>

        <div class="empty-state" id="emptyState" hidden>沒有符合條件的法術</div>

      <section class="class-view" id="classSpellView" hidden>
        <div class="class-grid" id="classGrid"></div>

      <section class="book-view" id="spellBookView" hidden>

          <div class="control">

        <div class="book-list" id="bookList"></div>

    </main>
  </div>

  <script>
    const state = {
      spells: [],
      filtered: [],
      view: "list",
      sortKey: "level",
      sortDirection: "asc",
      expanded: new Set(),
      classExpanded: null,
      collapsedClasses: new Set(),
      spellBook: new Set(),
      classSpells: null,
    };

    const SPELLBOOK_STORAGE_KEY = "rugatha.phb.spellbook";

    const classOrder = ["吟遊詩人", "牧師", "德魯伊", "聖騎士", "遊俠", "術士", "契術師", "法師"];

    const classSpellIds = {
      "吟遊詩人": "bard",
      "牧師": "cleric",
      "德魯伊": "druid",
      "聖騎士": "paladin",
      "遊俠": "ranger",
      "術士": "sorcerer",
      "契術師": "warlock",
      "法師": "wizard",
    };

    const classNames = {
      "吟遊詩人": "Bard", "牧師": "Cleric", "德魯伊": "Druid", "聖騎士": "Paladin",
      "遊俠": "Ranger", "術士": "Sorcerer", "契術師": "Warlock", "法師": "Wizard",
    };

    const translations = {
      zh: {
        title: "D&D 法術表", intro: "採用D&amp;D 5e玩家手冊內容<br>僅供遊玩使用，請勿外流",
        bookIntro: "可將會使用到的法術按下「加入」<br>一併在「法術書」裡檢視",
        listView: "法術清單", classView: "職業法術", bookView: "法術書", search: "搜尋",
        searchPlaceholder: "法術名稱、英文、內容、材料", level: "等級", school: "學派", all: "全部",
        components: "成分", verbal: "聲", somatic: "勢", material: "材", damage: "傷害", save: "豁免",
        concentration: "專注", attack: "攻擊", ritual: "儀式", yes: "是", no: "否", reset: "重設",
        spellAttack: "法術命中", savingAttack: "豁免攻擊", nonAttack: "非攻擊", source: "來源",
        add: "加入", added: "已加入", remove: "移除法術", expand: "展開", collapse: "收合",
        emptySpellbook: "法術書目前是空的", noSpellsToAdd: "沒有可新增的法術",
        name: "名稱", castingTime: "施法時間", range: "距離", duration: "持續時間", details: "內容",
        searchAdd: "搜尋新增法術", bookSearchPlaceholder: "輸入法術名稱、英文或內容", clearBook: "清空法術",
        loading: "讀取法術資料中", spellInfo: "施法資訊", variesByLevel: "見職業資訊",
        currentLanguage: "目前語言：中文", browserTitle: "D&D 法術表 | Rugatha"
      },
      en: {
        title: "D&D Spell List", intro: "Based on the D&amp;D 5e Player's Handbook.<br>For play use only.",
        bookIntro: "Use Add to save spells you use.<br>Review them together in Spellbook.",
        listView: "Spell List", classView: "Class Spells", bookView: "Spellbook", search: "Search",
        searchPlaceholder: "Spell name or details", level: "Level", school: "School", all: "All",
        components: "Components", verbal: "V", somatic: "S", material: "M", damage: "Damage", save: "Saving Throw",
        concentration: "Concentration", attack: "Attack", ritual: "Ritual", yes: "Yes", no: "No", reset: "Reset",
        spellAttack: "Spell Attack", savingAttack: "Saving Throw", nonAttack: "None", source: "Source",
        add: "Add", added: "Added", remove: "Remove spell", expand: "Expand", collapse: "Collapse",
        emptySpellbook: "Your spellbook is empty", noSpellsToAdd: "No spells to add",
        name: "Name", castingTime: "Casting Time", range: "Range", duration: "Duration", details: "Details",
        searchAdd: "Add a spell", bookSearchPlaceholder: "Spell name or details", clearBook: "Clear Spellbook",
        loading: "Loading spell data", spellInfo: "Spellcasting", variesByLevel: "See Class Info",
        currentLanguage: "Current language: English", browserTitle: "D&D Spell List | Rugatha"
      }
    };

    const LANGUAGE_STORAGE_KEY = "rugatha-language";
    let currentLanguage = "zh";

    const schoolNames = {
      A: { zh: "防護", en: "Abjuration" },
      C: { zh: "咒法", en: "Conjuration" },
      D: { zh: "預言", en: "Divination" },
      E: { zh: "附魔", en: "Enchantment" },
      I: { zh: "幻術", en: "Illusion" },
      N: { zh: "死靈", en: "Necromancy" },
      T: { zh: "變化", en: "Transmutation" },
      V: { zh: "塑能", en: "Evocation" },
    };

    const elements = {
      search: document.getElementById("searchInput"),
      level: document.getElementById("levelFilter"),
      school: document.getElementById("schoolFilter"),
      component: document.getElementById("componentFilter"),
      damage: document.getElementById("damageFilter"),
      save: document.getElementById("saveFilter"),
      concentration: document.getElementById("concentrationFilter"),
      attack: document.getElementById("attackFilter"),
      ritual: document.getElementById("ritualFilter"),
      reset: document.getElementById("resetButton"),
      toolbar: document.getElementById("filterToolbar"),
      count: document.getElementById("resultCount"),
      load: document.getElementById("loadState"),
      listView: document.getElementById("spellListView"),
      classView: document.getElementById("classSpellView"),
      bookView: document.getElementById("spellBookView"),
      bookSearch: document.getElementById("bookSearchInput"),
      bookSearchResults: document.getElementById("bookSearchResults"),
      bookList: document.getElementById("bookList"),
      clearBook: document.getElementById("clearBookButton"),
      classGrid: document.getElementById("classGrid"),
      table: document.getElementById("spellTable"),
      rows: document.getElementById("spellRows"),
      empty: document.getElementById("emptyState"),
      languageButton: document.querySelector("[data-lang-toggle]"),
    };

    function t(key) {
      return translations[currentLanguage][key] || key;
    }

    function classNameText(className) {
      return currentLanguage === "en" ? (classNames[className] || className) : className;
    }

    function setLanguage(language) {
      currentLanguage = language === "en" ? "en" : "zh";
      const dictionary = translations[currentLanguage];
      document.documentElement.lang = currentLanguage === "zh" ? "zh-Hant" : "en";
      document.body.dataset.lang = currentLanguage;
      document.title = dictionary.browserTitle;
      document.querySelectorAll("[data-i18n]").forEach((element) => {
        const value = dictionary[element.dataset.i18n];
        if (value) element.innerHTML = value;
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((element) => {
        element.placeholder = dictionary[element.dataset.i18nPlaceholder] || "";
      });
      elements.languageButton.dataset.lang = currentLanguage;
      elements.languageButton.setAttribute("aria-label", dictionary.currentLanguage);
      window.RugathaLanguageToggle?.setButtonIcon(elements.languageButton, currentLanguage);
      try {
        localStorage.setItem(LANGUAGE_STORAGE_KEY, currentLanguage);
      } catch (error) {
        // Language preference is optional when storage is unavailable.
      }
      if (state.spells.length) {
        populateFilters();
        renderRows();
        renderClassView();
        renderBookSearchResults();
        renderBookView();
        updateCount();
      }
    }

    function levelText(level) {
      if (currentLanguage === "en") {
        const suffix = Number(level) === 1 ? "st" : Number(level) === 2 ? "nd" : Number(level) === 3 ? "rd" : "th";
        return Number(level) === 0 ? "Cantrip" : `${level}${suffix}-level`;
      }
      return Number(level) === 0 ? "戲法" : `${level} 環`;
    }

    function arrayText(value) {
      return Array.isArray(value) && value.length ? value.join(currentLanguage === "en" ? ", " : "、") : "—";
    }

    function formatTime(time) {
      if (!Array.isArray(time) || !time.length) return "—";
      return time.map((item) => {
        const amount = item.number && item.number !== 1 ? `${item.number} ` : "";
        const condition = item.condition ? (currentLanguage === "en" ? ` (${item.condition})` : `（${item.condition}）`) : "";
        const value = `${amount}${item.unit || ""}${condition}`;
        return currentLanguage === "en" ? value.replace(/^([a-z])/, (letter) => letter.toUpperCase()) : value;
      }).join(currentLanguage === "en" ? ", " : "、");
    }

    function formatRange(range) {
      if (!range) return "—";
      if (range.type === "自身" || range.type === "self") return range.type;
      if (!range.distance) return range.type || "—";
      const amount = range.distance.amount ? `${range.distance.amount} ` : "";
      const unit = range.distance.type || "";
      return `${amount}${unit}`.trim() || range.type || "—";
    }

    function formatDuration(duration) {
      if (!Array.isArray(duration) || !duration.length) return "—";
      return duration.map((item) => {
        if (item.duration) {
          const amount = item.duration.amount ? `${item.duration.amount} ` : "";
          return `${amount}${item.duration.type || ""}`.trim();
        }
        return `${item.type || ""}`.trim();
      }).join(currentLanguage === "en" ? ", " : "、");
    }

    function hasConcentration(duration) {
      return Array.isArray(duration) && duration.some((item) => item && item.concentration);
    }

    function componentText(components) {
      if (!components) return "—";
      const parts = [];
      if (components.v) parts.push(currentLanguage === "en" ? "V" : "聲");
      if (components.s) parts.push(currentLanguage === "en" ? "S" : "勢");
      if (components.m) {
        const material = typeof components.m === "string" ? components.m : components.m.text;
        parts.push(currentLanguage === "en" ? `M${material ? ` (${material})` : ""}` : `材：${material || ""}`);
      }
      return parts.join(currentLanguage === "en" ? ", " : "、") || "—";
    }

    function componentKinds(components) {
      if (!components) return [];
      const parts = [];
      if (components.v) parts.push("v");
      if (components.s) parts.push("s");
      if (components.m) parts.push("m");
      return parts;
    }

    function normalizeSpell(spell, index) {
      const components = componentKinds(spell.components);
      const normalized = {
        ...spell,
        index,
        schoolText: schoolNames[spell.school]?.zh || spell.school || "—",
        timeText: formatTime(spell.time),
        rangeText: formatRange(spell.range),
        durationText: formatDuration(spell.duration),
        componentText: componentText(spell.components),
        componentKinds: components,
        componentSummaryText: arrayText(components),
        concentrationText: hasConcentration(spell.duration) ? "是" : "否",
        concentrationValue: hasConcentration(spell.duration),
        attackType: attackType(spell),
        attackText: attackText(spell),
        savingText: arrayText(spell.savingThrow),
        damageText: arrayText(spell.damageInflict),
        ritualText: spell.meta && spell.meta.ritual ? "是" : "否",
        ritualValue: Boolean(spell.meta && spell.meta.ritual),
      };
      normalized.contentText = [
        plainEntryText(normalized.entries),
        plainEntryText(normalized.entriesHigherLevel),
      ].join(" ").toLowerCase();
      normalized.contentTextEn = [
        plainEntryText(normalized.entries_en),
        plainEntryText(normalized.entriesHigherLevel_en),
      ].join(" ").toLowerCase();
      normalized.searchText = [
        normalized.name_zh,
        normalized.name_en,
        normalized.schoolText,
        normalized.timeText,
        normalized.rangeText,
        normalized.durationText,
        normalized.componentText,
        normalized.componentSummaryText,
        normalized.concentrationText,
        normalized.attackText,
        normalized.ritualText,
        normalized.savingText,
        normalized.damageText,
        normalized.contentText,
        normalized.contentTextEn,
      ].join(" ").toLowerCase();
      return normalized;
    }

    function plainEntryText(entries) {
      if (!entries) return "";
      if (typeof entries === "string") return stripTags(entries);
      if (Array.isArray(entries)) return entries.map(plainEntryText).join(" ");
      if (typeof entries === "object") {
        return Object.values(entries).map(plainEntryText).join(" ");
      }
      return "";
    }

    function localizedSpellEntries(spell, field = "entries") {
      const englishField = `${field}_en`;
      return currentLanguage === "en" && spell[englishField] ? spell[englishField] : spell[field];
    }

    function localizedSpellValue(spell, field) {
      const englishField = `${field}_en`;
      return currentLanguage === "en" && spell[englishField] !== undefined ? spell[englishField] : spell[field];
    }

    function schoolText(spell) {
      return schoolNames[spell.school]?.[currentLanguage] || spell.school || "—";
    }

    function timeText(spell) {
      return formatTime(localizedSpellValue(spell, "time"));
    }

    function rangeText(spell) {
      return formatRange(localizedSpellValue(spell, "range"));
    }

    function durationText(spell) {
      return formatDuration(localizedSpellValue(spell, "duration"));
    }

    function componentTextForLanguage(spell) {
      return componentText(localizedSpellValue(spell, "components"));
    }

    function componentSummaryText(spell) {
      return arrayText(spell.componentKinds.map((kind) => t({ v: "verbal", s: "somatic", m: "material" }[kind])));
    }

    function yesNoText(value) {
      return t(value ? "yes" : "no");
    }

    function attackType(spell) {
      if (!hasDamageCalculation(spell)) return "nonAttack";
      if (spell.spellAttack && spell.spellAttack.length) return "spellAttack";
      if (spell.savingThrow && spell.savingThrow.length) return "savingAttack";
      return "nonAttack";
    }

    function attackText(spell) {
      return t(attackType(spell));
    }

    function hasDamageCalculation(spell) {
      return Boolean(
        (spell.damageInflict && spell.damageInflict.length) ||
        entryHasDamageCalculation(spell.entries) ||
        entryHasDamageCalculation(spell.entriesHigherLevel)
      );
    }

    function entryHasDamageCalculation(entries) {
      if (!entries) return false;
      if (typeof entries === "string") return /\{@(?:damage|scaledamage)\s/i.test(entries);
      if (Array.isArray(entries)) return entries.some(entryHasDamageCalculation);
      if (typeof entries === "object") return Object.values(entries).some(entryHasDamageCalculation);
      return false;
    }

    function stripTags(text) {
      return String(text).replace(/\{@([^|}]+)\|?([^}]*)\}/g, (_, raw, display) => {
        if (display) return display.split("|").pop();
        return raw.replace(/^[a-zA-Z]+\s+/, "");
      });
    }

    function renderTagList(text) {
      if (!text || text === "—") return "—";
      const separator = currentLanguage === "en" ? ", " : "、";
      return `<div class="tag-list">${text.split(separator).map((item) => `<span class="tag">${escapeHtml(item)}</span>`).join("")}</div>`;
    }

    function populateFilters() {
      const selected = {
        level: elements.level.value,
        school: elements.school.value,
        damage: elements.damage.value,
        save: elements.save.value,
      };
      const levels = [...new Set(state.spells.map((spell) => spell.level))].sort((a, b) => a - b);
      const schools = [...new Set(state.spells.map((spell) => spell.school))]
        .sort((a, b) => schoolText({ school: a }).localeCompare(schoolText({ school: b }), currentLanguage === "en" ? "en" : "zh-Hant"));

      populateSelect(elements.level, levels.map((level) => ({ value: String(level), label: levelText(level) })), selected.level);
      populateSelect(elements.school, schools.map((school) => ({ value: school, label: schoolText({ school }) })), selected.school);
      populateSelect(elements.damage, localizedFilterOptions("damageInflict"), selected.damage);
      populateSelect(elements.save, localizedFilterOptions("savingThrow"), selected.save);
    }

    function populateSelect(element, options, selectedValue) {
      element.replaceChildren(new Option(t("all"), ""));
      options.forEach(({ value, label }) => element.append(new Option(label, value)));
      element.value = selectedValue;
    }

    function localizedFilterOptions(field) {
      const options = new Map();
      state.spells.forEach((spell) => {
        const values = spell[field] || [];
        const englishValues = spell[`${field}_en`] || [];
        values.forEach((value, index) => {
          if (!options.has(value)) {
            const label = currentLanguage === "en" ? (englishValues[index] || value) : value;
            options.set(value, currentLanguage === "en" ? `${label.charAt(0).toUpperCase()}${label.slice(1)}` : label);
          }
        });
      });
      return [...options]
        .map(([value, label]) => ({ value, label }))
        .sort((a, b) => a.label.localeCompare(b.label, currentLanguage === "en" ? "en" : "zh-Hant"));
    }

    function applyFilters() {
      const query = elements.search.value.trim().toLowerCase();
      const level = elements.level.value;
      const school = elements.school.value;
      const components = selectedComponents();
      const damage = elements.damage.value;
      const save = elements.save.value;
      const concentration = elements.concentration.value;
      const attack = elements.attack.value;
      const ritual = elements.ritual.value;

      state.filtered = state.spells.filter((spell) => {
        if (query && !spell.searchText.includes(query)) return false;
        if (level !== "" && String(spell.level) !== level) return false;
        if (school && spell.school !== school) return false;
        if (components.length && !components.every((component) => spell.componentKinds.includes(component))) return false;
        if (damage && !(spell.damageInflict || []).includes(damage)) return false;
        if (save && !(spell.savingThrow || []).includes(save)) return false;
        if (concentration && String(spell.concentrationValue) !== String(concentration === "yes")) return false;
        if (attack && spell.attackType !== attack) return false;
        if (ritual && String(spell.ritualValue) !== String(ritual === "yes")) return false;
        return true;
      });

      sortSpells();
      renderRows();
      updateCount();
    }

    function selectedComponents() {
      return Array.from(
        elements.component.querySelectorAll("button[aria-pressed='true']"),
        (button) => button.value
      );
    }

    function sortClasses(a, b) {
      const ai = classOrder.indexOf(a);
      const bi = classOrder.indexOf(b);
      if (ai !== -1 || bi !== -1) return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
      return a.localeCompare(b, "zh-Hant");
    }

    function sortSpells() {
      const direction = state.sortDirection === "asc" ? 1 : -1;
      state.filtered.sort((a, b) => {
        let left = a[state.sortKey];
        let right = b[state.sortKey];
        if (state.sortKey === "level") {
          return (Number(left) - Number(right) || a.name_zh.localeCompare(b.name_zh, "zh-Hant")) * direction;
        }
        left = String(left || "");
        right = String(right || "");
        return (left.localeCompare(right, "zh-Hant") || a.name_zh.localeCompare(b.name_zh, "zh-Hant")) * direction;
      });
    }

    function renderRows() {
      elements.empty.hidden = state.filtered.length !== 0;
      elements.table.hidden = state.filtered.length === 0;
      updateSortIndicators();

      const rows = [];
      state.filtered.forEach((spell) => {
        const rowId = `spell-${spell.index}`;
        const expanded = state.expanded.has(spell.index);
        rows.push(`
          <tr class="spell-row">
            <td data-label="${t("level")}">${levelText(spell.level)}</td>
            <td data-label="${t("school")}">${escapeHtml(schoolText(spell))}</td>
            <td class="cell-name" data-label="${t("name")}">
              <div class="name-cell">
                <span class="name-zh">${escapeHtml(spell.name_zh)}</span>
                <span class="name-en">${escapeHtml(spell.name_en)}</span>
              </div>
            </td>
            <td data-label="${t("castingTime")}">${escapeHtml(timeText(spell))}</td>
            <td data-label="${t("range")}">${escapeHtml(rangeText(spell))}</td>
            <td data-label="${t("duration")}">${escapeHtml(durationText(spell))}</td>
            <td data-label="${t("components")}">${renderTagList(componentSummaryText(spell))}</td>
            <td data-label="${t("concentration")}">${escapeHtml(yesNoText(spell.concentrationValue))}</td>
            <td data-label="${t("ritual")}">${escapeHtml(yesNoText(spell.ritualValue))}</td>
            <td data-label="${t("attack")}">${renderTagList(attackText(spell))}</td>
            <td data-label="${t("save")}">${renderTagList(arrayText(localizedSpellValue(spell, "savingThrow")))}</td>
            <td data-label="${t("damage")}">${renderTagList(arrayText(localizedSpellValue(spell, "damageInflict")))}</td>
            <td class="cell-book" data-label="${t("bookView")}">${renderBookButton(spell)}</td>
            <td class="cell-detail" data-label="${t("details")}"><button class="detail-button" type="button" data-toggle="${spell.index}" aria-expanded="${expanded}" aria-controls="${rowId}">${expanded ? t("collapse") : t("expand")}</button></td>
          </tr>
          <tr class="detail-row" id="${rowId}" ${expanded ? "" : "hidden"}>
            <td colspan="14">
              <div class="detail-panel">
                <div class="detail-meta desktop-detail-meta">
                  <span class="tag">${t("source")} ${escapeHtml(spell.source || "—")} p.${escapeHtml(spell.page || "—")}</span>
                </div>
                <div class="detail-meta mobile-detail-meta">
                  ${renderSpellDetailMeta(spell)}
                </div>
                <div class="mobile-detail-actions">
                  ${renderBookButton(spell)}
                </div>
                <div class="detail-text">
                  ${renderEntries(localizedSpellEntries(spell))}
                  ${spell.entriesHigherLevel ? renderEntries(localizedSpellEntries(spell, "entriesHigherLevel")) : ""}
                </div>
              </div>
            </td>
          </tr>
        `);
      });
      elements.rows.innerHTML = rows.join("");
    }

    function renderSpellDetailMeta(spell) {
      const metaItems = [
        levelText(spell.level),
        schoolText(spell),
        `${t("castingTime")} ${timeText(spell)}`,
        `${t("range")} ${rangeText(spell)}`,
        `${t("duration")} ${durationText(spell)}`,
        `${t("components")} ${componentTextForLanguage(spell)}`,
        `${t("concentration")} ${yesNoText(spell.concentrationValue)}`,
        `${t("ritual")} ${yesNoText(spell.ritualValue)}`,
        `${t("attack")} ${attackText(spell)}`,
        `${t("save")} ${arrayText(localizedSpellValue(spell, "savingThrow"))}`,
        `${t("damage")} ${arrayText(localizedSpellValue(spell, "damageInflict"))}`,
        `${t("source")} ${spell.source || "—"} p.${spell.page || "—"}`,
      ];
      return metaItems.map((item) => `<span class="tag">${escapeHtml(item)}</span>`).join("");
    }

    function renderClassView() {
      const classes = [...new Set(state.spells.flatMap((spell) => spell.classes || []))].sort(sortClasses);
      elements.classGrid.innerHTML = classes.map((className) => {
        const spells = state.spells
          .filter((spell) => (spell.classes || []).includes(className))
          .sort((a, b) => Number(a.level) - Number(b.level) || a.name_zh.localeCompare(b.name_zh, "zh-Hant"));
        const classCollapsed = state.collapsedClasses.has(className);
        const classPanelId = `class-panel-${className}`;
        const groups = [];
        for (let level = 0; level <= 9; level += 1) {
          const levelSpells = spells.filter((spell) => Number(spell.level) === level);
          if (!levelSpells.length) continue;
          groups.push(`
            <section class="level-group">
              <h3>${levelText(level)} · ${levelSpells.length}</h3>
              <ul class="class-spell-list">
                ${levelSpells.map((spell) => `
                  <li>
                    <button class="class-spell-button" type="button" data-class-spell="${spell.index}" data-class-spell-key="${classSpellKey(className, level, spell.index)}" aria-expanded="${state.classExpanded === classSpellKey(className, level, spell.index)}">
                      <span>${escapeHtml(spell.name_zh)}</span>
                      <small>${escapeHtml(spell.name_en)}</small>
                    </button>
                  </li>
                `).join("")}
              </ul>
              ${renderClassSpellDetail(className, level, levelSpells)}
            </section>
          `);
        }
        return `
          <article class="class-card${classCollapsed ? " is-collapsed" : ""}">
            <h2>
              <button class="class-toggle" type="button" data-class-toggle="${escapeHtml(className)}" aria-expanded="${!classCollapsed}" aria-controls="${escapeHtml(classPanelId)}" aria-label="${escapeHtml(classCollapsed ? `${currentLanguage === "en" ? "Expand " : "展開"}${classNameText(className)}` : `${currentLanguage === "en" ? "Collapse " : "收合"}${classNameText(className)}`)}">
                <span class="class-toggle-label">${escapeHtml(classNameText(className))} <small>${spells.length}</small></span>
                <span class="class-toggle-state ${classCollapsed ? "is-expand" : "is-collapse"}" aria-hidden="true"></span>
              </button>
            </h2>
            <div class="level-groups" id="${escapeHtml(classPanelId)}" ${classCollapsed ? "hidden" : ""}>
              ${renderClassSpellOverview(className)}
              ${groups.join("")}
            </div>
          </article>
        `;
      }).join("");
    }

    function classSpellKey(className, level, index) {
      return `${className}::${level}::${index}`;
    }

    function localizedClassSpellText(value) {
      if (typeof value === "string") return value;
      return value?.[currentLanguage] || value?.zh || value?.en || "—";
    }

    function classSpellValue(value, level, source) {
      if (Array.isArray(value)) return classSpellValue(value[level - 1], level, source);
      if (typeof value === "number") return String(value);
      if (typeof value === "string") return localizedClassSpellText(source.labels?.[value]) || value;
      if (value?.template === "spellbook") {
        const template = localizedClassSpellText(source.labels?.[value.template]);
        return template.replace("{count}", value.values?.[level - 1] ?? "—");
      }
      return localizedClassSpellText(value);
    }

    function renderClassSpellOverview(className) {
      const source = state.classSpells;
      const classData = source?.classes?.[classSpellIds[className]];
      if (!classData) return "";

      const labels = source.labels || {};
      const knownChangesByLevel = Array.isArray(classData.known) || classData.known?.template;
      const prepared = classSpellValue(classData.prepared, 1, source);
      const known = knownChangesByLevel
        ? t("variesByLevel")
        : classSpellValue(classData.known, 1, source);
      const ability = localizedClassSpellText(classData.casting_ability);

      return `
        <section class="class-spell-overview" aria-label="${escapeHtml(classNameText(className))} ${escapeHtml(t("spellInfo"))}">
          <h3>${escapeHtml(t("spellInfo"))}</h3>
          <dl class="class-spell-summary">
            <div><dt>${escapeHtml(localizedClassSpellText(labels.prepared))}</dt><dd>${escapeHtml(prepared)}</dd></div>
            <div><dt>${escapeHtml(localizedClassSpellText(labels.known))}</dt><dd>${escapeHtml(known)}</dd></div>
            <div><dt>${escapeHtml(localizedClassSpellText(labels.casting_ability))}</dt><dd>${escapeHtml(ability)}</dd></div>
          </dl>
        </section>
      `;
    }

    function renderClassSpellDetail(className, level, levelSpells) {
      const spell = levelSpells.find((item) => classSpellKey(className, level, item.index) === state.classExpanded);
      if (!spell) return "";
      return `
        <article class="class-spell-detail">
          <h4>${escapeHtml(spell.name_zh)} <small>${escapeHtml(spell.name_en)}</small></h4>
          <div class="detail-meta">
            <span class="tag">${levelText(spell.level)}</span>
            <span class="tag">${escapeHtml(schoolText(spell))}</span>
            <span class="tag">${escapeHtml(t("castingTime"))} ${escapeHtml(timeText(spell))}</span>
            <span class="tag">${escapeHtml(t("range"))} ${escapeHtml(rangeText(spell))}</span>
            <span class="tag">${escapeHtml(t("duration"))} ${escapeHtml(durationText(spell))}</span>
            <span class="tag">${escapeHtml(t("concentration"))} ${escapeHtml(yesNoText(spell.concentrationValue))}</span>
            <span class="tag">${escapeHtml(t("ritual"))} ${escapeHtml(yesNoText(spell.ritualValue))}</span>
            <span class="tag">${escapeHtml(t("components"))} ${escapeHtml(componentTextForLanguage(spell))}</span>
          </div>
          <div>${renderBookButton(spell)}</div>
          <div class="detail-text">
            ${renderEntries(localizedSpellEntries(spell))}
            ${spell.entriesHigherLevel ? renderEntries(localizedSpellEntries(spell, "entriesHigherLevel")) : ""}
          </div>
        </article>
      `;
    }

    function spellBookKey(spell) {
      return spell.name_en;
    }

    function isInSpellBook(spell) {
      return state.spellBook.has(spellBookKey(spell));
    }

    function renderBookButton(spell) {
      const inBook = isInSpellBook(spell);
      return `<button class="book-button" type="button" data-book-add="${spell.index}" ${inBook ? "disabled" : ""}>${t(inBook ? "added" : "add")}</button>`;
    }

    function loadSpellBook() {
      try {
        const stored = JSON.parse(localStorage.getItem(SPELLBOOK_STORAGE_KEY) || "[]");
        state.spellBook = new Set(Array.isArray(stored) ? stored : []);
      } catch {
        state.spellBook = new Set();
      }
    }

    function saveSpellBook() {
      localStorage.setItem(SPELLBOOK_STORAGE_KEY, JSON.stringify([...state.spellBook]));
    }

    function addToSpellBook(spell) {
      state.spellBook.add(spellBookKey(spell));
      saveSpellBook();
      refreshSpellBookDisplays();
    }

    function removeFromSpellBook(key) {
      state.spellBook.delete(key);
      saveSpellBook();
      refreshSpellBookDisplays();
    }

    function clearSpellBook() {
      state.spellBook.clear();
      saveSpellBook();
      refreshSpellBookDisplays();
    }

    function refreshSpellBookDisplays() {
      renderRows();
      renderClassView();
      renderBookSearchResults();
      renderBookView();
      updateCount();
    }

    function renderBookSearchResults() {
      const query = elements.bookSearch.value.trim().toLowerCase();
      if (!query) {
        elements.bookSearchResults.innerHTML = "";
        return;
      }
      const matches = state.spells
        .filter((spell) => !isInSpellBook(spell) && spell.searchText.includes(query))
        .slice(0, 18);
      elements.bookSearchResults.innerHTML = matches.length
        ? matches.map((spell) => `<button class="book-button" type="button" data-book-add="${spell.index}">${escapeHtml(spell.name_zh)} <small>${escapeHtml(spell.name_en)}</small></button>`).join("")
        : `<span class="tag">${t("noSpellsToAdd")}</span>`;
    }

    function renderBookView() {
      const spells = state.spells
        .filter((spell) => state.spellBook.has(spellBookKey(spell)))
        .sort((a, b) => Number(a.level) - Number(b.level) || a.name_zh.localeCompare(b.name_zh, "zh-Hant"));
      elements.clearBook.disabled = spells.length === 0;
      if (!spells.length) {
        elements.bookList.innerHTML = `<div class="empty-state">${t("emptySpellbook")}</div>`;
        return;
      }
      elements.bookList.innerHTML = spells.map((spell) => `
        <article class="book-card">
          <div class="book-card-header">
            <div>
              <h2>
                <span class="name-zh">${escapeHtml(spell.name_zh)}</span>
                <small class="name-en">${escapeHtml(spell.name_en)}</small>
              </h2>
            </div>
            <button class="remove-button" type="button" data-book-remove="${escapeHtml(spellBookKey(spell))}">${t("remove")}</button>
          </div>
          <div class="detail-meta">
            <span class="tag">${levelText(spell.level)}</span>
            <span class="tag">${escapeHtml(schoolText(spell))}</span>
            <span class="tag">${escapeHtml(t("castingTime"))} ${escapeHtml(timeText(spell))}</span>
            <span class="tag">${escapeHtml(t("range"))} ${escapeHtml(rangeText(spell))}</span>
            <span class="tag">${escapeHtml(t("duration"))} ${escapeHtml(durationText(spell))}</span>
            <span class="tag">${escapeHtml(t("concentration"))} ${escapeHtml(yesNoText(spell.concentrationValue))}</span>
            <span class="tag">${escapeHtml(t("ritual"))} ${escapeHtml(yesNoText(spell.ritualValue))}</span>
            <span class="tag">${escapeHtml(t("components"))} ${escapeHtml(componentTextForLanguage(spell))}</span>
          </div>
          <div class="detail-text">
            ${renderEntries(localizedSpellEntries(spell))}
            ${spell.entriesHigherLevel ? renderEntries(localizedSpellEntries(spell, "entriesHigherLevel")) : ""}
          </div>
        </article>
      `).join("");
    }

    function updateView() {
      const isList = state.view === "list";
      const isClass = state.view === "class";
      const isBook = state.view === "book";
      elements.toolbar.hidden = !isList;
      elements.listView.hidden = !isList;
      elements.classView.hidden = !isClass;
      elements.bookView.hidden = !isBook;
      document.querySelectorAll("[data-view]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.view === state.view));
      });
      updateCount();
    }

    function updateCount() {
      if (state.view === "class") {
        const classCount = new Set(state.spells.flatMap((spell) => spell.classes || [])).size;
        elements.count.textContent = currentLanguage === "en"
          ? `${classCount} classes / ${state.spells.length} spells`
          : `${classCount} 個職業 / ${state.spells.length} 個法術`;
      } else if (state.view === "book") {
        elements.count.textContent = currentLanguage === "en" ? `${state.spellBook.size} spells` : `${state.spellBook.size} 個法術`;
      } else {
        elements.count.textContent = currentLanguage === "en"
          ? `${state.filtered.length} / ${state.spells.length} spells`
          : `${state.filtered.length} / ${state.spells.length} 個法術`;
      }
    }

    function renderEntries(entries) {
      if (!entries) return "";
      if (typeof entries === "string") return `<p>${renderInline(entries)}</p>`;
      if (Array.isArray(entries)) return entries.map(renderEntries).join("");
      if (entries.type === "entries" || entries.type === "條目") {
        const name = entries.name ? `<p><strong>${escapeHtml(entries.name)}</strong></p>` : "";
        return `${name}${renderEntries(entries.entries || [])}`;
      }
      if (entries.type === "list" || entries.type === "列表") {
        const items = (entries.items || []).map((item) => `<li>${renderInline(typeof item === "string" ? item : plainEntryText(item))}</li>`).join("");
        return `<ul>${items}</ul>`;
      }
      if (entries.type === "table" || entries.type === "表格") {
        const caption = entries.caption ? `<p><strong>${escapeHtml(entries.caption)}</strong></p>` : "";
        const labels = (entries.colLabels || []).map((label) => `<th>${escapeHtml(label)}</th>`).join("");
        const rows = (entries.rows || []).map((row) => `<tr>${row.map((cell) => `<td>${renderInline(typeof cell === "string" ? cell : plainEntryText(cell))}</td>`).join("")}</tr>`).join("");
        return `${caption}<table><thead><tr>${labels}</tr></thead><tbody>${rows}</tbody></table>`;
      }
      return `<p>${renderInline(plainEntryText(entries))}</p>`;
    }

    function renderInline(value) {
      return escapeHtml(stripTags(value)).replace(/\n/g, "<br>");
    }

    function updateSortIndicators() {
      document.querySelectorAll("[data-sort]").forEach((button) => {
        const icon = button.querySelector("span[aria-hidden]");
        icon.textContent = button.dataset.sort === state.sortKey ? (state.sortDirection === "asc" ? "▲" : "▼") : "";
      });
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;",
      })[char]);
    }

    elements.search.addEventListener("input", applyFilters);
    elements.languageButton.addEventListener("click", () => {
      setLanguage(currentLanguage === "en" ? "zh" : "en");
    });
    elements.level.addEventListener("change", applyFilters);
    elements.school.addEventListener("change", applyFilters);
    elements.component.querySelectorAll("button").forEach((button) => {
      button.addEventListener("click", () => {
        button.setAttribute("aria-pressed", button.getAttribute("aria-pressed") !== "true");
        applyFilters();
      });
    });
    elements.damage.addEventListener("change", applyFilters);
    elements.save.addEventListener("change", applyFilters);
    elements.concentration.addEventListener("change", applyFilters);
    elements.attack.addEventListener("change", applyFilters);
    elements.ritual.addEventListener("change", applyFilters);
    document.querySelectorAll("[data-view]").forEach((button) => {
      button.addEventListener("click", () => {
        state.view = button.dataset.view;
        if (state.view === "book") {
          renderBookSearchResults();
          renderBookView();
        }
        updateView();
      });
    });
    elements.reset.addEventListener("click", () => {
      elements.search.value = "";
      elements.level.value = "";
      elements.school.value = "";
      elements.component.querySelectorAll("button").forEach((button) => {
        button.setAttribute("aria-pressed", "false");
      });
      elements.damage.value = "";
      elements.save.value = "";
      elements.concentration.value = "";
      elements.attack.value = "";
      elements.ritual.value = "";
      state.sortKey = "level";
      state.sortDirection = "asc";
      state.expanded.clear();
      applyFilters();
    });

    document.querySelectorAll("[data-sort]").forEach((button) => {
      button.addEventListener("click", () => {
        if (state.sortKey === button.dataset.sort) {
          state.sortDirection = state.sortDirection === "asc" ? "desc" : "asc";
        } else {
          state.sortKey = button.dataset.sort;
          state.sortDirection = "asc";
        }
        sortSpells();
        renderRows();
      });
    });

    elements.rows.addEventListener("click", (event) => {
      const button = event.target.closest("[data-toggle]");
      if (!button) return;
      const index = Number(button.dataset.toggle);
      if (state.expanded.has(index)) {
        state.expanded.delete(index);
      } else {
        state.expanded.add(index);
      }
      renderRows();
    });

    document.addEventListener("click", (event) => {
      const addButton = event.target.closest("[data-book-add]");
      if (addButton) {
        const spell = state.spells[Number(addButton.dataset.bookAdd)];
        if (spell) addToSpellBook(spell);
        return;
      }

      const removeButton = event.target.closest("[data-book-remove]");
      if (removeButton) {
        removeFromSpellBook(removeButton.dataset.bookRemove);
      }
    });

    elements.bookSearch.addEventListener("input", renderBookSearchResults);
    elements.clearBook.addEventListener("click", clearSpellBook);

    elements.classGrid.addEventListener("click", (event) => {
      const classButton = event.target.closest("[data-class-toggle]");
      if (classButton) {
        const className = classButton.dataset.classToggle;
        if (state.collapsedClasses.has(className)) {
          state.collapsedClasses.delete(className);
        } else {
          state.collapsedClasses.add(className);
          if (state.classExpanded && state.classExpanded.startsWith(`${className}::`)) {
            state.classExpanded = null;
          }
        }
        renderClassView();
        return;
      }

      const button = event.target.closest("[data-class-spell]");
      if (button) {
        const key = button.dataset.classSpellKey;
        state.classExpanded = state.classExpanded === key ? null : key;
        renderClassView();
        return;
      }
      if (event.target.closest(".class-spell-detail")) return;
      if (state.classExpanded !== null) {
        state.classExpanded = null;
        renderClassView();
      }
    });

    Promise.all([
      fetch("spells-phb.json").then((response) => {
        if (!response.ok) throw new Error(`spells-phb.json: HTTP ${response.status}`);
        return response.json();
      }),
      fetch("../race_class/class_spells.json").then((response) => {
        if (!response.ok) throw new Error(`class_spells.json: HTTP ${response.status}`);
        return response.json();
      }),
    ])
      .then(([spellData, classSpellData]) => {
        state.spells = (spellData.spell || []).map(normalizeSpell);
        state.classSpells = classSpellData;
        state.collapsedClasses = new Set([...new Set(state.spells.flatMap((spell) => spell.classes || []))]);
        loadSpellBook();
        populateFilters();
        renderClassView();
        renderBookView();
        elements.load.hidden = true;
        elements.table.hidden = false;
        applyFilters();
        updateView();
      })
      .catch((error) => {
        elements.load.className = "error-state";
        elements.load.textContent = `無法讀取法術資料：${error.message}`;
        elements.count.textContent = "讀取失敗";
      });

    try {
      setLanguage(localStorage.getItem(LANGUAGE_STORAGE_KEY));
    } catch (error) {
      setLanguage("zh");
    }
  </script>

  <script src="../../shared/firebase.config.js"></script>
  <script type="module" src="../../shared/auth.js"></script>
</body>
</html>
