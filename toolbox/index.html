<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BZZFKMJ65Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-BZZFKMJ65Y', {
      page_title: 'Toolbox | Rugatha',
      page_path: window.location.pathname,
      page_location: window.location.href
    });
    gtag('event', 'tool_page_view', {
      tool_name: 'toolbox_home',
      page_path: window.location.pathname,
      page_title: 'Toolbox | Rugatha'
    });
  </script>
  <title>Toolbox | Rugatha</title>
  <link rel="icon" type="image/png" href="../assets/logo/rugatha-favicon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/rugatha-favicon-32.png">
  <link rel="stylesheet" href="../shared/styles/theme.css">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../assets/logo/rugatha-icon-192.png">
  <script defer src="../shared/pwa.js"></script>
  <script src="../shared/language-toggle.js"></script>
  <style>
    :root {
      --tools-line: rgba(236, 242, 237, 0.2);
      --tools-line-strong: rgba(236, 242, 237, 0.42);
      --tools-panel: rgba(236, 242, 237, 0.08);
      --tools-panel-hover: rgba(236, 242, 237, 0.14);
      --tools-muted: rgba(236, 242, 237, 0.74);
      --tools-gold: #d9b66f;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      width: min(920px, calc(100vw - 32px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 0 64px;
      display: grid;
      align-content: start;
      gap: 36px;
    }

    .language-toggle {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      display: inline-flex;
    }

    .language-toggle button {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .language-toggle button:hover,
    .language-toggle button:focus-visible {
      opacity: 0.86;
      transform: translateY(-1px);
      outline: none;
    }

    .language-toggle__icon {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .banner {
      display: flex;
      justify-content: center;
    }

    .banner-link {
      display: inline-flex;
    }

    .banner-img {
      width: min(360px, 78vw);
      height: auto;
      display: block;
    }

    .title {
      display: grid;
      justify-items: center;
      text-align: center;
    }

    main {
      display: grid;
      gap: 32px;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .tool-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .tool-link {
      min-height: 112px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 18px;
      padding: 22px 24px;
      border: 1px solid var(--tools-line);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(217, 182, 111, 0.13), transparent 34%),
        var(--tools-panel);
      color: var(--text);
      text-decoration: none;
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.18);
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .tool-link:hover,
    .tool-link:focus-visible {
      transform: translateX(4px);
      border-color: var(--tools-line-strong);
      background:
        linear-gradient(135deg, rgba(217, 182, 111, 0.2), transparent 38%),
        var(--tools-panel-hover);
      box-shadow: 0 20px 52px rgba(0, 0, 0, 0.24);
      outline: none;
    }

    .tool-mark {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .tool-mark img {
      width: 68px;
      height: 68px;
      display: block;
      object-fit: contain;
    }

    .tool-mark img.logo-dnd {
      width: 54px;
      height: 54px;
      filter: brightness(0.78);
    }

    .tool-copy {
      display: grid;
      gap: 7px;
      min-width: 0;
    }

    .tool-name {
      font-size: clamp(1.3rem, 2vw, 1.7rem);
      font-weight: 800;
      line-height: 1.1;
    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 24px, 920px);
        padding-top: 72px;
      }

      .language-toggle {
        top: 8px;
        left: 8px;
      }

      .language-toggle button {
        width: 58px;
        height: 58px;
      }

      .tool-link {
        grid-template-columns: auto minmax(0, 1fr);
        padding: 18px;
      }

      .tool-mark {
        width: 56px;
        height: 56px;
      }

      .tool-mark img {
        width: 52px;
        height: 52px;
      }

      .tool-mark img.logo-dnd {
        width: 42px;
        height: 42px;
      }
    }
  </style>
</head>
<body>
  <div class="language-toggle" role="group" aria-label="Language">
    <button type="button" data-lang="zh" aria-pressed="true" aria-label="目前語言：中文" data-lang-toggle></button>
  </div>

  <div class="page">
    <header class="banner">
      <a class="banner-link" href="../index.html" aria-label="Rugatha home">
        <img src="../assets/banner/rugatha-banner-trademark.png" alt="Rugatha banner" class="banner-img">
      </a>
    </header>

    <main>
      <section class="title" aria-labelledby="tools-title">
        <h1 id="tools-title" data-i18n="title">工具箱</h1>
      </section>

      <ul class="tool-list" aria-label="Tools">
        <li>
          <a class="tool-link" href="character_card/">
            <span class="tool-mark" aria-hidden="true">
              <img src="../assets/logo/rugatha-icon.png" alt="">
            </span>
            <span class="tool-copy">
              <span class="tool-name" data-i18n="characterCard">角色卡製作器</span>
            </span>
          </a>
        </li>
        <li>
          <a class="tool-link" href="spells/">
            <span class="tool-mark" aria-hidden="true">
              <img class="logo-dnd" src="../assets/logo/D&D_logo.png" alt="">
            </span>
            <span class="tool-copy">
              <span class="tool-name" data-i18n="spells">D&amp;D 法術表</span>
            </span>
          </a>
        </li>
        <li>
          <a class="tool-link" href="weapons/">
            <span class="tool-mark" aria-hidden="true">
              <img class="logo-dnd" src="../assets/logo/D&amp;D_logo.png" alt="">
            </span>
            <span class="tool-copy">
              <span class="tool-name" data-i18n="weapons">D&amp;D 武器表</span>
            </span>
          </a>
        </li>
        <li>
          <a class="tool-link" href="armor/">
            <span class="tool-mark" aria-hidden="true">
              <img class="logo-dnd" src="../assets/logo/D&amp;D_logo.png" alt="">
            </span>
            <span class="tool-copy">
              <span class="tool-name" data-i18n="armor">D&amp;D 護甲表</span>
            </span>
          </a>
        </li>
        <li>
          <a class="tool-link" href="race_class/">
            <span class="tool-mark" aria-hidden="true">
              <img class="logo-dnd" src="../assets/logo/D&D_logo.png" alt="">
            </span>
            <span class="tool-copy">
              <span class="tool-name" data-i18n="raceClass">D&amp;D 種族與職業</span>
            </span>
          </a>
        </li>
        <li>
          <a class="tool-link" href="packs/">
            <span class="tool-mark" aria-hidden="true">
              <img class="logo-dnd" src="../assets/logo/D&amp;D_logo.png" alt="">
            </span>
            <span class="tool-copy">
              <span class="tool-name" data-i18n="packs">D&amp;D 裝備包</span>
            </span>
          </a>
        </li>
        <li>
          <a class="tool-link" href="background/">
            <span class="tool-mark" aria-hidden="true">
              <img class="logo-dnd" src="../assets/logo/D&amp;D_logo.png" alt="">
            </span>
            <span class="tool-copy">
              <span class="tool-name" data-i18n="backgrounds">D&amp;D 背景</span>
            </span>
          </a>
        </li>
        <li>
          <a class="tool-link" href="feats/">
            <span class="tool-mark" aria-hidden="true">
              <img class="logo-dnd" src="../assets/logo/D&amp;D_logo.png" alt="">
            </span>
            <span class="tool-copy">
              <span class="tool-name" data-i18n="feats">D&amp;D 專長</span>
            </span>
          </a>
        </li>
        <li>
          <a class="tool-link" href="tools/">
            <span class="tool-mark" aria-hidden="true">
              <img class="logo-dnd" src="../assets/logo/D&amp;D_logo.png" alt="">
            </span>
            <span class="tool-copy">
              <span class="tool-name" data-i18n="dndTools">D&amp;D 工具</span>
            </span>
          </a>
        </li>
      </ul>
    </main>
  </div>
  <script>
    const translations = {
      zh: {
        browserTitle: "工具箱 | Rugatha",
        title: "工具箱",
        characterCard: "角色卡製作器",
        spells: "D&D 法術表",
        weapons: "D&D 武器表",
        armor: "D&D 護甲表",
        raceClass: "D&D 種族與職業",
        packs: "D&D 裝備包",
        backgrounds: "D&D 背景",
        feats: "D&D 專長",
        dndTools: "D&D 工具",
        aria: "目前語言：中文"
      },
      en: {
        browserTitle: "Toolbox | Rugatha",
        title: "Toolbox",
        characterCard: "Character Card",
        spells: "D&D Spells",
        weapons: "D&D Weapons",
        armor: "D&D Armor",
        raceClass: "D&D Race & Class",
        packs: "D&D Equipment Packs",
        backgrounds: "D&D Backgrounds",
        feats: "D&D Feats",
        dndTools: "D&D Tools",
        aria: "Current language: English"
      }
    };

    const languageButton = document.querySelector("[data-lang-toggle]");
    const i18nElements = document.querySelectorAll("[data-i18n]");
    const storageKey = "rugatha-language";

    const normalizeLanguage = (language) => language === "en" ? "en" : "zh";
    const getStoredLanguage = () => {
      try {
        return localStorage.getItem(storageKey);
      } catch (error) {
        return null;
      }
    };

    const storeLanguage = (language) => {
      try {
        localStorage.setItem(storageKey, language);
      } catch (error) {
        return;
      }
    };

    const setLanguage = (language) => {
      const lang = normalizeLanguage(language);
      const dictionary = translations[lang];
      document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
      document.body.dataset.lang = lang;
      document.title = dictionary.browserTitle;
      storeLanguage(lang);

      i18nElements.forEach((element) => {
        const key = element.dataset.i18n;
        if (dictionary[key]) {
          element.textContent = dictionary[key];
        }
      });

      languageButton.dataset.lang = lang;
      languageButton.setAttribute("aria-label", dictionary.aria);
      if (window.RugathaLanguageToggle) {
        window.RugathaLanguageToggle.setButtonIcon(languageButton, lang);
      }
    };

    languageButton.addEventListener("click", () => {
      setLanguage(languageButton.dataset.lang === "en" ? "zh" : "en");
    });

    setLanguage(getStoredLanguage() || "zh");
  </script>

  <script src="../shared/firebase.config.js"></script>
  <script type="module" src="../shared/auth.js"></script>
</body>
</html>
