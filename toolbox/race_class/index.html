<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BZZFKMJ65Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-BZZFKMJ65Y', {
      page_title: 'Race & Class | Rugatha',
      page_path: window.location.pathname,
      page_location: window.location.href
    });
    gtag('event', 'tool_page_view', {
      tool_name: 'race_class',
      page_path: window.location.pathname,
      page_title: 'Race & Class | Rugatha'
    });
  </script>
  <title>Race & Class | Rugatha</title>
  <link rel="icon" type="image/png" href="../../assets/logo/rugatha-favicon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/logo/rugatha-favicon-32.png">
  <link rel="stylesheet" href="../../shared/styles/theme.css">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../assets/logo/rugatha-icon-192.png">
  <script defer src="../../shared/pwa.js"></script>
  <script src="../../shared/language-toggle.js"></script>
  <style>
    :root {
      --rc-line: rgba(236, 242, 237, 0.2);
      --rc-line-strong: rgba(236, 242, 237, 0.42);
      --rc-panel: rgba(236, 242, 237, 0.08);
      --rc-panel-hover: rgba(236, 242, 237, 0.14);
      --rc-muted: rgba(236, 242, 237, 0.72);
      --rc-gold: #d9b66f;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      width: min(920px, calc(100vw - 32px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 0 64px;
      display: grid;
      align-content: start;
      gap: 34px;
    }

    .language-toggle {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      display: inline-flex;
    }

    .language-toggle button {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .language-toggle button:hover,
    .language-toggle button:focus-visible {
      opacity: 0.86;
      transform: translateY(-1px);
      outline: none;
    }

    .language-toggle__icon {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .banner {
      display: flex;
      justify-content: center;
    }

    .banner-link {
      display: inline-flex;
    }

    .banner-img {
      width: min(360px, 78vw);
      height: auto;
      display: block;
    }

    main {
      display: grid;
      gap: 28px;
    }

    .title {
      display: grid;
      justify-items: center;
      text-align: center;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .mode-toggle {
      width: min(520px, 100%);
      justify-self: center;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      padding: 6px;
      border: 1px solid var(--rc-line);
      border-radius: 8px;
      background: rgba(236, 242, 237, 0.07);
    }

    .mode-toggle button {
      min-height: 48px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--rc-muted);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease;
    }

    .mode-toggle button[aria-pressed="true"] {
      background: rgba(217, 182, 111, 0.18);
      color: var(--text);
    }

    .locked-note {
      margin: -8px 0 0;
      color: var(--rc-muted);
      font-size: 0.9rem;
      text-align: center;
    }

    .option-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .option-item {
      display: grid;
      gap: 10px;
    }

    .option-card {
      width: 100%;
      min-height: 88px;
      display: grid;
      grid-template-columns: auto minmax(150px, 0.65fr) minmax(240px, 1fr);
      align-items: center;
      gap: 18px;
      padding: 18px 22px;
      border: 1px solid var(--rc-line);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(217, 182, 111, 0.12), transparent 34%),
        var(--rc-panel);
      color: var(--text);
      font: inherit;
      text-align: left;
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.16);
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    button.option-card {
      cursor: pointer;
    }

    button.option-card:hover,
    button.option-card:focus-visible {
      transform: translateX(4px);
      border-color: var(--rc-line-strong);
      background:
        linear-gradient(135deg, rgba(217, 182, 111, 0.18), transparent 38%),
        var(--rc-panel-hover);
      outline: none;
    }

    .option-mark {
      position: relative;
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .option-mark img {
      width: 48px;
      height: 48px;
      display: block;
      object-fit: contain;
      filter: brightness(0.68);
    }

    .option-copy {
      display: grid;
      min-width: 0;
    }

    .option-name {
      font-size: clamp(1.3rem, 2vw, 1.65rem);
      font-weight: 800;
      line-height: 1.1;
    }

    .subrace-section {
      display: grid;
      gap: 8px;
      margin: 2px 0 0 116px;
      padding-left: 18px;
      border-left: 2px solid rgba(217, 182, 111, 0.42);
    }

    .subrace-section-title {
      color: rgba(217, 182, 111, 0.9);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1.3;
    }

    .subrace-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .subrace-item {
      display: grid;
      gap: 8px;
    }

    .subrace-card {
      width: 100%;
      display: grid;
      grid-template-columns: auto minmax(140px, 0.55fr) minmax(220px, 1fr);
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border: 1px solid rgba(236, 242, 237, 0.16);
      border-radius: 8px;
      background: rgba(236, 242, 237, 0.06);
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .subrace-card:hover,
    .subrace-card:focus-visible {
      transform: translateX(4px);
      border-color: var(--rc-line-strong);
      background: rgba(236, 242, 237, 0.1);
      outline: none;
    }

    .subrace-card[aria-expanded="true"] {
      border-color: rgba(217, 182, 111, 0.48);
      background: rgba(217, 182, 111, 0.1);
    }

    .subrace-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .subrace-mark img {
      width: 28px;
      height: 28px;
      display: block;
      object-fit: contain;
      filter: brightness(0.68);
    }

    .subrace-name {
      font-weight: 800;
      line-height: 1.25;
    }

    .note-box {
      min-height: 0;
      display: grid;
      align-content: center;
      padding: 0;
      color: rgba(236, 242, 237, 0.86);
      font-size: 0.95rem;
      line-height: 1.55;
      text-align: right;
      white-space: pre-line;
    }

    .note-box.is-empty {
      color: rgba(236, 242, 237, 0.46);
      font-style: italic;
    }

    .option-details {
      display: block;
      margin-left: 92px;
      padding: 16px;
      border: 1px solid rgba(236, 242, 237, 0.16);
      border-radius: 8px;
      background: rgba(236, 242, 237, 0.06);
      text-align: left;
    }

    .class-levels {
      display: grid;
      gap: 8px;
      margin-left: 92px;
    }

    .class-level-item {
      display: grid;
      gap: 8px;
    }

    .class-level-card {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border: 1px solid rgba(236, 242, 237, 0.16);
      border-radius: 8px;
      background: rgba(236, 242, 237, 0.06);
      color: var(--text);
      font: inherit;
      font-weight: 800;
      text-align: left;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .class-level-card:hover,
    .class-level-card:focus-visible {
      transform: translateX(4px);
      border-color: var(--rc-line-strong);
      background: rgba(236, 242, 237, 0.1);
      outline: none;
    }

    .class-level-card[aria-expanded="true"] {
      border-color: rgba(217, 182, 111, 0.48);
      background: rgba(217, 182, 111, 0.1);
    }

    .class-level-card::after {
      content: "▸";
      color: var(--rc-gold);
      font-size: 1.2rem;
      line-height: 1;
      transition: transform 160ms ease;
    }

    .class-level-card[aria-expanded="true"]::after {
      content: "▾";
    }

    .class-level-details.option-details {
      margin-left: 0;
    }

    .class-overview {
      display: grid;
      gap: 8px;
      margin-left: 92px;
    }

    .class-overview-details.option-details {
      margin-left: 0;
    }

    .details-heading {
      margin: 1rem 0 0.2rem;
      color: var(--text);
      font-weight: 800;
      line-height: 1.35;
    }

    .details-heading:first-child {
      margin-top: 0;
    }

    .details-paragraph,
    .details-list {
      margin: 0.15rem 0 0.85rem;
    }

    .details-list {
      padding-left: 1.25rem;
    }

    .details-list li + li {
      margin-top: 0.1rem;
    }

    .details-table-wrap {
      max-width: 100%;
      margin: 0.15rem 0 0.85rem;
      overflow-x: auto;
      border: 1px solid rgba(236, 242, 237, 0.16);
      border-radius: 6px;
    }

    .details-table {
      width: 100%;
      min-width: 0;
      border-collapse: collapse;
      table-layout: fixed;
      color: inherit;
      font: inherit;
      white-space: normal;
    }

    .details-table th,
    .details-table td {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(236, 242, 237, 0.12);
      text-align: left;
      vertical-align: top;
    }

    .details-table th + th,
    .details-table td + td {
      border-left: 1px solid rgba(236, 242, 237, 0.16);
    }

    .details-table th {
      background: rgba(217, 182, 111, 0.12);
      color: var(--text);
      font-weight: 800;
    }

    .details-table th:first-child,
    .details-table td:first-child {
      width: 72px;
      white-space: nowrap;
    }

    .details-table th:last-child,
    .details-table td:last-child {
      overflow-wrap: anywhere;
    }

    .details-table--two-column {
      min-width: 420px;
    }

    .details-table--two-column th:first-child,
    .details-table--two-column td:first-child {
      width: clamp(180px, 24%, 240px);
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .details-table tbody tr:last-child td {
      border-bottom: 0;
    }

    .class-spell-table {
      width: max-content;
      min-width: 0;
      table-layout: auto;
    }

    .class-spell-table th,
    .class-spell-table td {
      width: auto;
      text-align: left;
      white-space: nowrap;
    }

    .class-spell-table th:first-child,
    .class-spell-table td:first-child {
      width: auto;
    }

    .class-spell-table-wrap {
      width: fit-content;
    }

    .details-indent-1 {
      margin-left: 1.5rem;
    }

    .details-indent-2 {
      margin-left: 3rem;
    }

    .option-details > :last-child,
    .subrace-details > :last-child {
      margin-bottom: 0;
    }

    .subrace-details {
      display: block;
      margin-left: 44px;
      padding: 14px 16px;
      border-left: 2px solid rgba(217, 182, 111, 0.42);
      border-radius: 0 8px 8px 0;
      background: rgba(236, 242, 237, 0.04);
      text-align: left;
    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 24px, 920px);
        padding-top: 72px;
      }

      .language-toggle {
        top: 8px;
        left: 8px;
      }

      .language-toggle button {
        width: 58px;
        height: 58px;
      }

      .mode-toggle button {
        min-height: 44px;
      }

      .option-card {
        grid-template-columns: auto minmax(0, 1fr);
        padding: 16px;
      }

      .option-mark {
        width: 48px;
        height: 48px;
      }

      .option-mark img {
        width: 40px;
        height: 40px;
      }

      .subrace-section {
        margin-left: 66px;
        padding-left: 14px;
      }

      .option-details {
        margin-left: 66px;
      }

      .class-levels {
        margin-left: 66px;
      }

      .class-overview {
        margin-left: 66px;
      }

      .subrace-card {
        grid-template-columns: auto minmax(0, 1fr);
        padding: 10px 12px;
      }

      .subrace-details {
        margin-left: 32px;
      }

      .details-indent-1 {
        margin-left: 1rem;
      }

      .details-indent-2 {
        margin-left: 2rem;
      }

      .note-box {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>
  <div class="language-toggle" role="group" aria-label="Language">
    <button type="button" data-lang="zh" aria-pressed="true" aria-label="目前語言：中文" data-lang-toggle></button>
  </div>

  <div class="page">
    <header class="banner">
      <a class="banner-link" href="../../index.html" aria-label="Rugatha home">
        <img src="../../assets/banner/rugatha-banner-trademark.png" alt="Rugatha banner" class="banner-img">
      </a>
    </header>

    <main>
      <section class="title" aria-labelledby="page-title">
        <h1 id="page-title" data-i18n="title">種族與職業</h1>
      </section>

      <div class="mode-toggle" role="group" aria-label="Race and class toggle">
        <button type="button" data-mode="race" aria-pressed="true" data-i18n="raceToggle">Race 種族</button>
        <button type="button" data-mode="class" aria-pressed="false" data-i18n="classToggle">Class 職業</button>
      </div>

      <p class="locked-note" id="lockedNote" data-i18n="locked">登入後可點選種族與職業查看詳細設定。</p>

      <ul class="option-list" id="option-list" aria-live="polite"></ul>
    </main>
  </div>

  <script>
    const translations = {
      zh: {
        browserTitle: "種族與職業 | Rugatha",
        title: "種族與職業",
        raceToggle: "種族",
        classToggle: "職業",
        locked: "登入後可點選種族與職業查看詳細設定。",
        subraceLabel: "子種族",
        classLevelLabel: "職業等級",
        classLevel: "{level} 等",
        dataError: "無法載入種族與職業資料。",
        aria: "目前語言：中文"
      },
      en: {
        browserTitle: "Race & Class | Rugatha",
        title: "Race & Class",
        raceToggle: "Race",
        classToggle: "Class",
        locked: "Sign in to select a race or class and view its details.",
        subraceLabel: "Subraces",
        classLevelLabel: "Class Levels",
        classLevel: "Level {level}",
        dataError: "Unable to load race and class data.",
        aria: "Current language: English"
      }
    };

    const data = { race: [], class: [], tables: {}, classSpells: null };

    const buttons = Array.from(document.querySelectorAll("[data-mode]"));
    const list = document.getElementById("option-list");
    const lockedNote = document.getElementById("lockedNote");
    const languageButton = document.querySelector("[data-lang-toggle]");
    const i18nElements = document.querySelectorAll("[data-i18n]");
    const storageKey = "rugatha-language";
    let currentMode = "race";
    let currentLanguage = "zh";
    let isAuthenticated = window.RUGATHA_AUTH_SIGNED_IN === true;
    const expandedOptionIds = { race: null, class: null };
    const expandedClassLevelIds = {};
    const expandedClassOverviewIds = {};
    let expandedSubraceId = null;
    let dataLoadError = null;

    const normalizeLanguage = (language) => language === "en" ? "en" : "zh";
    const escapeHTML = (value) => String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

    const getNote = (item, type) => {
      const key = `${type}_${currentLanguage}`;
      const note = item.note && item.note[key] ? item.note[key].trim() : "";
      return {
        text: note,
        isEmpty: !note
      };
    };

    const getClassLevelNote = (item, level) => {
      const key = `lvl${String(level).padStart(2, "0")}_details_${currentLanguage}`;
      const note = item.note && item.note[key] ? item.note[key].trim() : "";
      return {
        text: note,
        isEmpty: !note
      };
    };

    const detailsHeadingLevels = {
      zh: new Map([
        ["箭術", 1],
        ["防禦", 1],
        ["決鬥", 1],
        ["巨武器戰鬥", 1],
        ["守護", 1],
        ["雙武器戰鬥", 1],
        ["龍族血脈", 1],
        ["狂野魔法", 1],
        ["龍族祖先", 2],
        ["龍族韌性", 2],
        ["狂野魔法潮湧", 2],
        ["狂野魔法潮湧表", 2],
        ["混亂浪潮", 2],
        ["至高妖精", 1],
        ["邪魔", 1],
        ["舊日支配者", 1],
        ["龍族血統", 1]
      ]),
      en: new Map([
        ["Archery", 1],
        ["Defense", 1],
        ["Dueling", 1],
        ["Great Weapon Fighting", 1],
        ["Protection", 1],
        ["Two-Weapon Fighting", 1],
        ["Draconic Bloodline", 1],
        ["Wild Magic", 1],
        ["Dragon Ancestor", 2],
        ["Draconic Resilience", 2],
        ["Wild Magic Surge", 2],
        ["Wild Magic Surge Table", 2],
        ["Tides of Chaos", 2],
        ["The Archfey", 1],
        ["The Fiend", 1],
        ["The Great Old One", 1],
        ["Draconic Ancestry", 1]
      ])
    };

    const applyDetailsIndent = (element, level) => {
      if (level > 0) element.classList.add(`details-indent-${level}`);
    };

    const getLocalizedTableText = (value) => {
      if (typeof value === "string") return value;
      return value?.[currentLanguage] || value?.zh || value?.en || "";
    };

    const getClassSpellCell = (value, level, source) => {
      if (typeof value === "number") return String(value);
      if (typeof value === "string") return getLocalizedTableText(source.labels?.[value]) || value;
      if (value?.template === "spellbook") {
        const template = getLocalizedTableText(source.labels?.[value.template]);
        return template.replace("{count}", value.values[level - 1]);
      }
      return getLocalizedTableText(value);
    };

    const renderClassSpellTable = (container, classId) => {
      const source = data.classSpells;
      const classSpells = source?.classes?.[classId];
      const slotProgression = source?.slot_progressions?.[classSpells?.slot_progression];
      if (!classSpells || !Array.isArray(slotProgression) || slotProgression.length !== 20) return;

      const heading = document.createElement("div");
      heading.className = "details-heading";
      heading.textContent = getLocalizedTableText(source.labels?.spell_progression);
      container.appendChild(heading);

      const preparation = document.createElement("p");
      preparation.className = "details-paragraph class-spell-summary";
      const preparationValue = classSpells.prepared === "not_applicable"
        ? getLocalizedTableText(source.labels?.no_preparation)
        : getClassSpellCell(classSpells.prepared, 1, source);
      preparation.textContent = `${getLocalizedTableText(source.labels?.prepared)}：${preparationValue}`;
      container.appendChild(preparation);

      if (!Array.isArray(classSpells.known)) {
        const known = document.createElement("p");
        known.className = "details-paragraph class-spell-summary";
        known.textContent = `${getLocalizedTableText(source.labels?.known)}：${getClassSpellCell(classSpells.known, 1, source)}`;
        container.appendChild(known);
      }

      const tableWrap = document.createElement("div");
      tableWrap.className = "details-table-wrap class-spell-table-wrap";
      const table = document.createElement("table");
      table.className = "details-table class-spell-table";
      const showKnown = Array.isArray(classSpells.known) || classSpells.known?.template;
      const tableHead = document.createElement("thead");
      const topHeadRow = document.createElement("tr");
      const levelHeading = document.createElement("th");
      levelHeading.scope = "col";
      levelHeading.rowSpan = 2;
      levelHeading.textContent = getLocalizedTableText(source.labels?.level);
      topHeadRow.appendChild(levelHeading);
      if (showKnown) {
        const knownHeading = document.createElement("th");
        knownHeading.scope = "col";
        knownHeading.rowSpan = 2;
        knownHeading.textContent = getLocalizedTableText(source.labels?.known);
        topHeadRow.appendChild(knownHeading);
      }
      const slotsHeading = document.createElement("th");
      slotsHeading.scope = "colgroup";
      slotsHeading.colSpan = 9;
      slotsHeading.textContent = getLocalizedTableText(source.labels?.spell_slots_per_level);
      topHeadRow.appendChild(slotsHeading);
      const slotLevelHeadRow = document.createElement("tr");
      for (let spellLevel = 1; spellLevel <= 9; spellLevel += 1) {
        const headingCell = document.createElement("th");
        headingCell.scope = "col";
        headingCell.textContent = String(spellLevel);
        slotLevelHeadRow.appendChild(headingCell);
      }
      tableHead.append(topHeadRow, slotLevelHeadRow);
      table.appendChild(tableHead);

      const tableBody = document.createElement("tbody");
      slotProgression.forEach((slots, index) => {
        const level = index + 1;
        const row = document.createElement("tr");
        [level, ...(showKnown ? [Array.isArray(classSpells.known) ? classSpells.known[index] : classSpells.known] : []), ...slots.map((slot) => slot === 0 ? "not_applicable" : slot)]
          .forEach((cell) => {
            const dataCell = document.createElement("td");
            dataCell.textContent = getClassSpellCell(cell, level, source);
            row.appendChild(dataCell);
          });
        tableBody.appendChild(row);
      });
      table.appendChild(tableBody);
      tableWrap.appendChild(table);
      container.appendChild(tableWrap);
    };

    const renderReferencedTable = (container, tableId, indentLevel) => {
      const source = data.tables[tableId];
      if (!source) return;

      const tableWrap = document.createElement("div");
      tableWrap.className = "details-table-wrap";
      const table = document.createElement("table");
      table.className = "details-table";
      const tableHead = document.createElement("thead");
      const headRow = document.createElement("tr");
      [source.columns?.roll || "d100", getLocalizedTableText(source.columns?.effect)].forEach((cell) => {
        const heading = document.createElement("th");
        heading.scope = "col";
        heading.textContent = cell;
        headRow.appendChild(heading);
      });
      tableHead.appendChild(headRow);
      table.appendChild(tableHead);

      const tableBody = document.createElement("tbody");
      source.rows.forEach((entry) => {
        const row = document.createElement("tr");
        [entry.roll, getLocalizedTableText(entry.effect)].forEach((cell) => {
          const dataCell = document.createElement("td");
          dataCell.textContent = cell;
          row.appendChild(dataCell);
        });
        tableBody.appendChild(row);
      });
      table.appendChild(tableBody);
      tableWrap.appendChild(table);
      applyDetailsIndent(tableWrap, indentLevel);
      container.appendChild(tableWrap);
    };

    const renderDetailsContent = (container, text) => {
      const blocks = text
        .split(/\n\s*\n/)
        .map((block) => block.trim())
        .filter(Boolean);
      let currentIndentLevel = 0;

      blocks.forEach((block) => {
        const lines = block.split("\n").map((line) => line.trim()).filter(Boolean);
        const tableReference = lines.length === 1 && /^\{\{table:([a-z0-9_-]+)\}\}$/.exec(lines[0]);
        const isList = lines.length > 0 && lines.every((line) => line.startsWith("• "));
        const isTable = lines.length >= 3
          && lines.every((line) => line.startsWith("|") && line.endsWith("|"))
          && /^\|(?:\s*:?-{3,}:?\s*\|)+$/.test(lines[1]);
        const isHeading = lines.length === 1
          && lines[0].length <= 48
          && !/[。.!?：:]$/.test(lines[0]);

        if (tableReference) {
          renderReferencedTable(container, tableReference[1], currentIndentLevel);
          currentIndentLevel = 0;
          return;
        }

        if (isTable) {
          const parseRow = (line) => line.slice(1, -1).split("|").map((cell) => cell.trim());
          const tableWrap = document.createElement("div");
          tableWrap.className = "details-table-wrap";
          const table = document.createElement("table");
          table.className = "details-table";
          const headerCells = parseRow(lines[0]);
          if (headerCells.length === 2) {
            table.classList.add("details-table--two-column");
          }
          const tableHead = document.createElement("thead");
          const headRow = document.createElement("tr");
          headerCells.forEach((cell) => {
            const heading = document.createElement("th");
            heading.scope = "col";
            heading.textContent = cell;
            headRow.appendChild(heading);
          });
          tableHead.appendChild(headRow);
          table.appendChild(tableHead);

          const tableBody = document.createElement("tbody");
          lines.slice(2).forEach((line) => {
            const row = document.createElement("tr");
            parseRow(line).forEach((cell) => {
              const dataCell = document.createElement("td");
              dataCell.textContent = cell;
              row.appendChild(dataCell);
            });
            tableBody.appendChild(row);
          });
          table.appendChild(tableBody);
          tableWrap.appendChild(table);
          applyDetailsIndent(tableWrap, currentIndentLevel);
          container.appendChild(tableWrap);
          currentIndentLevel = 0;
          return;
        }

        if (isList) {
          const listElement = document.createElement("ul");
          listElement.className = "details-list";
          lines.forEach((line) => {
            const item = document.createElement("li");
            item.textContent = line.slice(2);
            listElement.appendChild(item);
          });
          applyDetailsIndent(listElement, currentIndentLevel);
          container.appendChild(listElement);
          return;
        }

        const element = document.createElement(isHeading ? "div" : "p");
        element.className = isHeading ? "details-heading" : "details-paragraph";
        element.textContent = block;
        if (isHeading) {
          currentIndentLevel = detailsHeadingLevels[currentLanguage].get(block) ?? 0;
        }
        applyDetailsIndent(element, currentIndentLevel);
        container.appendChild(element);
      });
    };

    const getStoredLanguage = () => {
      try {
        return localStorage.getItem(storageKey);
      } catch (error) {
        return null;
      }
    };

    const storeLanguage = (language) => {
      try {
        localStorage.setItem(storageKey, language);
      } catch (error) {
        return;
      }
    };

    const loadDetails = async (path) => {
      const response = await fetch(path);
      if (!response.ok) {
        throw new Error(`Failed to load ${path}: ${response.status}`);
      }
      const details = await response.json();
      if (!Array.isArray(details)) {
        throw new Error(`${path} must contain a JSON array.`);
      }
      return details;
    };

    const loadTable = async (path) => {
      const response = await fetch(path);
      if (!response.ok) {
        throw new Error(`Failed to load ${path}: ${response.status}`);
      }
      const table = await response.json();
      if (!table || typeof table.id !== "string" || !Array.isArray(table.rows)) {
        throw new Error(`${path} must contain a table id and rows.`);
      }
      return table;
    };

    const loadClassSpells = async () => {
      const response = await fetch("class_spells.json");
      if (!response.ok) throw new Error(`Failed to load class_spells.json: ${response.status}`);
      const classSpells = await response.json();
      if (!classSpells?.classes || !classSpells?.progressions || !classSpells?.labels) {
        throw new Error("class_spells.json must contain labels, progressions, and classes.");
      }
      return classSpells;
    };

    const renderClassOverview = (container, item, detailsNote) => {
      if (detailsNote.isEmpty) return;

      const section = document.createElement("section");
      section.className = "class-overview";
      const isExpanded = expandedClassOverviewIds[item.id] === true;
      const overviewId = `class-overview-${item.id}`;

      const overviewButton = document.createElement("button");
      overviewButton.className = "class-level-card class-overview-card";
      overviewButton.type = "button";
      overviewButton.setAttribute("aria-expanded", String(isExpanded));
      overviewButton.setAttribute("aria-controls", overviewId);
      overviewButton.textContent = currentLanguage === "zh" ? "職業" : "Class";
      overviewButton.addEventListener("click", () => {
        expandedClassOverviewIds[item.id] = !isExpanded;
        renderOptions("class");
      });
      section.appendChild(overviewButton);

      if (isExpanded) {
        const overviewDetails = document.createElement("div");
        overviewDetails.id = overviewId;
        overviewDetails.className = "class-overview-details option-details note-box";
        if (detailsNote.text === "{{class_spell_table}}") {
          renderClassSpellTable(overviewDetails, item.id);
        } else {
          renderDetailsContent(overviewDetails, detailsNote.text);
        }
        section.appendChild(overviewDetails);
      }

      container.appendChild(section);
    };

    const renderClassLevels = (container, item) => {
      const section = document.createElement("section");
      section.className = "class-levels";
      section.setAttribute("aria-label", translations[currentLanguage].classLevelLabel);

      const heading = document.createElement("div");
      heading.className = "subrace-section-title";
      heading.textContent = translations[currentLanguage].classLevelLabel;
      section.appendChild(heading);

      const expandedLevel = expandedClassLevelIds[item.id] ?? null;
      for (let level = 1; level <= 20; level += 1) {
        const levelNote = getClassLevelNote(item, level);
        if (levelNote.isEmpty) continue;
        const isExpanded = expandedLevel === level;
        const levelItem = document.createElement("div");
        levelItem.className = "class-level-item";

        const levelId = `class-level-${item.id}-${level}`;
        const levelButton = document.createElement("button");
        levelButton.className = "class-level-card";
        levelButton.type = "button";
        levelButton.setAttribute("aria-expanded", String(isExpanded));
        levelButton.setAttribute("aria-controls", levelId);
        levelButton.textContent = translations[currentLanguage].classLevel.replace("{level}", level);
        levelButton.addEventListener("click", () => {
          expandedClassLevelIds[item.id] = isExpanded ? null : level;
          renderOptions("class");
        });
        levelItem.appendChild(levelButton);

        if (isExpanded) {
          const levelDetails = document.createElement("div");
          levelDetails.id = levelId;
          levelDetails.className = "class-level-details option-details note-box";

          renderDetailsContent(levelDetails, levelNote.text);

          levelItem.appendChild(levelDetails);
        }

        section.appendChild(levelItem);
      }

      container.appendChild(section);
    };

    const renderOptions = (mode) => {
      lockedNote.hidden = isAuthenticated;
      list.replaceChildren();
      if (dataLoadError) {
        const errorItem = document.createElement("li");
        errorItem.className = "option-card";
        errorItem.textContent = translations[currentLanguage].dataError;
        list.appendChild(errorItem);
        return;
      }
      data[mode].forEach((item) => {
        const label = currentLanguage === "zh" ? item.zh : item.en;
        const basicNote = getNote(item, "basic");
        const detailsNote = getNote(item, "details");
        const hasSubraces = mode === "race" && Array.isArray(item.subraces) && item.subraces.length > 0;
        const isExpanded = expandedOptionIds[mode] === item.id;
        const li = document.createElement("li");
        li.className = "option-item";

        const card = document.createElement("button");
        card.className = "option-card";
        card.type = "button";
        card.setAttribute("aria-expanded", String(isExpanded));
        card.setAttribute("aria-disabled", String(!isAuthenticated));
        card.innerHTML = `
          <span class="option-mark" aria-hidden="true">
            <img src="../../assets/logo/D&D_logo.png" alt="">
          </span>
          <span class="option-copy">
            <span class="option-name">${escapeHTML(label)}</span>
          </span>
          <span class="note-box${basicNote.isEmpty ? " is-empty" : ""}">${escapeHTML(basicNote.text)}</span>
        `;
        card.addEventListener("click", () => {
          if (!isAuthenticated) return;
          expandedOptionIds[mode] = isExpanded ? null : item.id;
          if (mode === "race") expandedSubraceId = null;
          renderOptions(mode);
        });
        li.appendChild(card);

        if (isExpanded && mode === "class") {
          renderClassOverview(li, item, detailsNote);
          renderClassLevels(li, item);
        } else if (isExpanded && !detailsNote.isEmpty) {
          const details = document.createElement("div");
          details.className = "option-details note-box";
          renderDetailsContent(details, detailsNote.text);
          li.appendChild(details);
        }

        if (isExpanded && hasSubraces) {
          const subraceSection = document.createElement("div");
          subraceSection.className = "subrace-section";
          subraceSection.setAttribute("role", "group");
          subraceSection.setAttribute("aria-label", translations[currentLanguage].subraceLabel);

          const subraceSectionTitle = document.createElement("div");
          subraceSectionTitle.className = "subrace-section-title";
          subraceSectionTitle.textContent = translations[currentLanguage].subraceLabel;
          subraceSection.appendChild(subraceSectionTitle);

          const subraceList = document.createElement("ul");
          subraceList.className = "subrace-list";
          item.subraces.forEach((subrace) => {
            const subraceLabel = currentLanguage === "zh" ? subrace.zh : subrace.en;
            const subraceNote = getNote(subrace, "basic");
            const subraceDetailsNote = getNote(subrace, "details");
            const isSubraceExpanded = expandedSubraceId === subrace.id;
            const subraceDetailsId = `subrace-details-${item.id}-${subrace.id}`;
            const subraceItem = document.createElement("li");
            subraceItem.className = "subrace-item";

            const subraceCard = document.createElement("button");
            subraceCard.className = "subrace-card";
            subraceCard.type = "button";
            subraceCard.setAttribute("aria-expanded", String(isSubraceExpanded));
            subraceCard.setAttribute("aria-disabled", String(subraceDetailsNote.isEmpty));
            if (!subraceDetailsNote.isEmpty) subraceCard.setAttribute("aria-controls", subraceDetailsId);
            subraceCard.innerHTML = `
              <span class="subrace-mark" aria-hidden="true">
                <img src="../../assets/logo/D&D_logo.png" alt="">
              </span>
              <span class="subrace-name">${escapeHTML(subraceLabel)}</span>
              <span class="note-box${subraceNote.isEmpty ? " is-empty" : ""}">${escapeHTML(subraceNote.text)}</span>
            `;
            subraceCard.addEventListener("click", () => {
              if (!isAuthenticated || subraceDetailsNote.isEmpty) return;
              expandedSubraceId = isSubraceExpanded ? null : subrace.id;
              renderOptions("race");
            });
            subraceItem.appendChild(subraceCard);

            if (isSubraceExpanded && !subraceDetailsNote.isEmpty) {
              const subraceDetails = document.createElement("div");
              subraceDetails.className = "subrace-details note-box";
              subraceDetails.id = subraceDetailsId;
              renderDetailsContent(subraceDetails, subraceDetailsNote.text);
              subraceItem.appendChild(subraceDetails);
            }

            subraceList.appendChild(subraceItem);
          });
          subraceSection.appendChild(subraceList);
          li.appendChild(subraceSection);
        }

        list.appendChild(li);
      });
    };

    const setLanguage = (language) => {
      const lang = normalizeLanguage(language);
      const dictionary = translations[lang];
      currentLanguage = lang;
      document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
      document.body.dataset.lang = lang;
      document.title = dictionary.browserTitle;
      storeLanguage(lang);

      i18nElements.forEach((element) => {
        const key = element.dataset.i18n;
        if (dictionary[key]) {
          element.textContent = dictionary[key];
        }
      });

      languageButton.dataset.lang = lang;
      languageButton.setAttribute("aria-label", dictionary.aria);
      if (window.RugathaLanguageToggle) {
        window.RugathaLanguageToggle.setButtonIcon(languageButton, lang);
      }

      renderOptions(currentMode);
    };

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        const mode = button.dataset.mode;
        currentMode = mode;
        buttons.forEach((item) => {
          item.setAttribute("aria-pressed", String(item === button));
        });
        renderOptions(mode);
      });
    });

    languageButton.addEventListener("click", () => {
      setLanguage(languageButton.dataset.lang === "en" ? "zh" : "en");
    });

    window.addEventListener("rugatha:auth-state-changed", (event) => {
      isAuthenticated = event.detail?.signedIn === true;
      if (!isAuthenticated) {
        expandedOptionIds.race = null;
        expandedOptionIds.class = null;
        expandedSubraceId = null;
      }
      renderOptions(currentMode);
    });

    const initialize = async () => {
      try {
        const [races, classes, classSpells] = await Promise.all([
          loadDetails("race_details.json"),
          loadDetails("class_details.json"),
          loadClassSpells()
        ]);
        const tablePaths = [...new Set(classes.flatMap((item) => Object.values(item.tables || {})))];
        const tables = await Promise.all(tablePaths.map(loadTable));
        data.race = races;
        data.class = classes;
        data.classSpells = classSpells;
        data.tables = Object.fromEntries(tables.map((table) => [table.id, table]));
      } catch (error) {
        dataLoadError = error;
        console.error("Failed to load race and class details", error);
      }
      setLanguage(getStoredLanguage() || "zh");
    };

    initialize();
  </script>
  <script src="../../shared/rugatha.config.js"></script>
  <script src="../../shared/firebase.config.js"></script>
  <script type="module" src="../../shared/auth.js"></script>
</body>
</html>
