<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>D&amp;D 5e 角色卡 | Rugatha</title>
  <link rel="icon" type="image/png" href="../../assets/logo/rugatha-favicon.png">
  <link rel="stylesheet" href="../../shared/styles/theme.css">
  <script src="../../shared/language-toggle.js"></script>
  <style>
    :root { --sheet-line: rgba(236,242,237,.2); --sheet-line-strong: rgba(236,242,237,.42); --sheet-panel: rgba(236,242,237,.08); --sheet-panel-hover: rgba(236,242,237,.14); --sheet-muted: rgba(236,242,237,.72); --sheet-gold: #d9b66f; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; background: var(--bg); color: var(--text); }
    .page { width: min(920px, calc(100vw - 32px)); min-height: 100vh; margin: 0 auto; padding: 28px 0 64px; display: grid; align-content: start; gap: 30px; visibility: hidden; }
    .page.is-authorized { visibility: visible; }
    .language-toggle { position: fixed; top: 16px; left: 16px; z-index: 10; display: inline-flex; }
    .language-toggle button { width: 72px; height: 72px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer; transition: opacity 160ms ease, transform 160ms ease; }
    .language-toggle button:hover, .language-toggle button:focus-visible { opacity: .86; transform: translateY(-1px); outline: none; }
    .language-toggle__icon { width: 100%; height: 100%; display: block; object-fit: contain; }
    .banner { display: flex; justify-content: center; }
    .banner-link { display: inline-flex; }
    .banner-img { width: min(360px, 78vw); height: auto; display: block; }
    main { display: grid; gap: 28px; }
    .hero { display: grid; justify-items: center; gap: 10px; text-align: center; }
    .hero h1 { margin: 0; font-size: clamp(2rem, 6vw, 4rem); line-height: 1; }
    .hero p { max-width: 680px; margin: 0; color: var(--sheet-muted); line-height: 1.55; }
    .sheet { display: grid; gap: 20px; }
    .sheet-section { display: grid; gap: 12px; padding: 18px; border: 1px solid var(--sheet-line); border-radius: 8px; background: linear-gradient(135deg, rgba(217,182,111,.08), transparent 34%), var(--sheet-panel); box-shadow: 0 14px 38px rgba(0,0,0,.16); }
    .portrait-grid { display: grid; grid-template-columns: 180px minmax(220px, 1fr); gap: 18px; align-items: center; }
    .portrait-tools { min-width: 0; display: grid; grid-template-columns: minmax(120px, 1fr) minmax(170px, 1.15fr); gap: 12px; align-items: start; }
    .portrait-preview { position: relative; width: 180px; aspect-ratio: 3 / 4; display: grid; place-items: center; overflow: hidden; border: 1px dashed var(--sheet-line-strong); border-radius: 8px; background: rgba(236,242,237,.05); color: var(--sheet-muted); text-align: center; }
    .portrait-preview img { width: 100%; height: 100%; object-fit: cover; cursor: grab; touch-action: none; }
    .portrait-preview img.is-dragging { cursor: grabbing; }
    .portrait-preview span { padding: 14px; font-size: .8rem; line-height: 1.45; }
    .portrait-controls { position: static; display: grid; gap: 10px; }
    .portrait-file { display: none; }
    .portrait-controls .button { width: fit-content; min-height: 32px; padding: 5px 10px; font-size: .78rem; }
    .portrait-controls .field { display: grid; gap: 5px; }
    .portrait-controls .field > label:not(.button) { display: none; }
    .portrait-controls input[type="url"] { width: min(180px, 100%); min-height: 30px; padding: 5px 7px; font-size: .75rem; }
    .portrait-crop { min-width: 0; display: grid; gap: 10px; margin: 0; padding: 12px; border: 1px solid var(--sheet-line); border-radius: 8px; }
    .portrait-crop label { display: grid; grid-template-columns: 58px 1fr; align-items: center; gap: 10px; margin: 0; }
    .portrait-crop input[type="range"] { width: 100%; padding: 0; accent-color: var(--sheet-gold); }
    .portrait-crop .button { justify-self: start; min-height: 34px; padding: 6px 10px; font-size: .78rem; }
    .portrait-crop[hidden] { display: none; }
    .attack-table-layout { display: block; }
    .mobile-table-add { display: none; justify-content: flex-end; padding-top: 5px; }
    .icon-button { width: 28px; height: 28px; padding: 0; border: 1px solid var(--sheet-line-strong); border-radius: 50%; background: var(--sheet-panel); color: var(--sheet-gold); font-size: 1rem; line-height: 1; cursor: pointer; }
    .icon-button:hover, .icon-button:focus-visible { border-color: var(--sheet-gold); background: var(--sheet-panel-hover); outline: none; }
    .attack-action-cell { width: 38px; padding-right: 0 !important; }
    .attack-remove { width: 28px; height: 28px; font-size: 1rem; }
    .weapon-cell { display: grid; grid-template-columns: auto minmax(120px, 1fr); gap: 5px; align-items: center; }
    .weapon-proficiency { color: var(--sheet-muted); font-size: .8rem; font-weight: 800; white-space: nowrap; }
    .weapon-proficiency.is-proficient { color: var(--sheet-gold); }
    .attack-custom { min-height: 30px; padding: 4px 7px; font-size: .72rem; white-space: nowrap; }
    .weapon-custom[hidden], .weapon-select[hidden] { display: none; }
    .attack-auto[readonly] { opacity: .78; }
    .table-wrap { overflow-x: auto; }
    .sheet-table { width: 100%; min-width: 700px; border-collapse: collapse; }
    .sheet-table th { padding: 8px 9px; color: var(--sheet-gold); font-size: .74rem; text-align: left; white-space: nowrap; }
    .sheet-table td { padding: 5px; border-top: 1px solid var(--sheet-line); }
    .sheet-table td:first-child, .sheet-table th:first-child { width: 24%; }
    .spell-table { min-width: 420px; }
    .spell-table td:first-child, .spell-table th:first-child { width: 54px; }
    .spell-table td:nth-child(2), .spell-table th:nth-child(2) { width: auto; }
    .spell-table td:last-child, .spell-table th:last-child { width: 38px; }
    .spell-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .spell-list-link { flex: 0 0 auto; color: var(--sheet-gold); font-size: .82rem; font-weight: 800; text-decoration: none; }
    .spell-list-link:hover, .spell-list-link:focus-visible { text-decoration: underline; }
    .spell-info { min-height: 32px; padding: 5px 8px; font-size: .76rem; white-space: nowrap; }
    .section-title { display: flex; align-items: center; gap: 10px; margin: 0; color: var(--sheet-gold); font-size: 1.35rem; line-height: 1.1; }
    .section-title::after { content: ""; height: 1px; flex: 1; background: var(--sheet-line); }
    .grid { display: grid; gap: 12px; }
    .identity { grid-template-columns: repeat(3, 1fr); }
    #classSection { border: 0; box-shadow: none; padding: 0; }
    #classSection > .section-title, #classSection > .subtle { display: none; }
    .class-grid { grid-template-columns: 1fr 150px auto; align-items: end; }
    .alignment-grid { grid-template-columns: 1fr 1fr; }
    .stats { grid-template-columns: repeat(6, 1fr); }
    .combat { grid-template-columns: repeat(5, 1fr); }
    .three { grid-template-columns: repeat(3, 1fr); }
    .adventure-grid { grid-template-columns: repeat(4, 1fr); }
    .wealth-grid { grid-template-columns: repeat(4, 1fr); }
    .two { grid-template-columns: repeat(2, 1fr); }
    .field, .ability, .panel-box { min-width: 0; }
    label, .label { display: block; margin-bottom: 6px; color: var(--sheet-muted); font-size: .74rem; font-weight: 800; letter-spacing: .06em; }
    input, select, textarea { width: 100%; border: 1px solid var(--sheet-line); border-radius: 5px; padding: 9px 10px; background: rgba(13,37,29,.5); color: var(--text); font: inherit; }
    .calculated-value { display: block; width: 100%; min-height: 40px; padding: 9px 10px; border: 1px solid var(--sheet-line); border-radius: 5px; background: rgba(13,37,29,.5); color: var(--text); font: inherit; font-weight: 900; }
    input::placeholder, textarea::placeholder { color: rgba(236,242,237,.42); }
    input:focus, select:focus, textarea:focus { border-color: var(--sheet-gold); outline: 3px solid rgba(217,182,111,.16); }
    select { color-scheme: dark; }
    option { background: #173429; color: #f4f7f2; }
    textarea { min-height: 78px; resize: vertical; line-height: 1.45; }
    .custom-input { margin-top: 8px; }
    .armor-loadout { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--sheet-line); border-radius: 6px; background: rgba(236,242,237,.05); }
    .armor-loadout-row { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; align-items: center; }
    .armor-loadout-row > label { margin: 0; color: var(--sheet-gold); }
    .wear-field { display: inline-flex; align-items: center; gap: 7px; margin: 0; color: var(--sheet-muted); font-size: .78rem; cursor: pointer; }
    .wear-field input { appearance: none; width: 19px; height: 19px; margin: 0; border: 2px solid var(--sheet-line-strong); border-radius: 50%; background: transparent; cursor: pointer; }
    .wear-field input:checked { border-color: var(--sheet-gold); background: var(--sheet-gold); box-shadow: inset 0 0 0 4px #173429; }
    #shieldCustom[hidden] { display: none; }
    #feat { min-height: 86px; }
    .feat-picker { position: relative; display: grid; gap: 7px; }
    .feat-picker-toggle { width: 100%; min-height: 42px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 10px; border: 1px solid var(--sheet-line); border-radius: 5px; background: rgba(13,37,29,.5); color: var(--text); text-align: left; font: inherit; cursor: pointer; }
    .feat-picker-toggle::after { content: "⌄"; flex: 0 0 auto; color: var(--text); font-size: 1.1em; line-height: 1; }
    .feat-picker-menu { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 8; max-height: 220px; overflow: auto; padding: 7px; border: 1px solid var(--sheet-line-strong); border-radius: 6px; background: #173429; box-shadow: 0 12px 28px rgba(0,0,0,.3); }
    .feat-picker-menu[hidden] { display: none; }
    .feat-picker-filter { margin-bottom: 5px; padding: 7px 8px; background: rgba(13,37,29,.7); color: var(--text); }
    .feat-picker-option { display: flex; align-items: center; gap: 8px; padding: 7px; color: var(--text); font-size: .8rem; cursor: pointer; }
    .feat-picker-option input { width: 18px; height: 18px; }
    .feat-picker-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .shield-editor-fields { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px; }
    .attack-notes { min-height: 42px; resize: vertical; line-height: 1.35; }
    .spell-name-cell { display: grid; grid-template-columns: minmax(0, 1fr) 30px; gap: 6px; align-items: center; }
    .spell-expand { width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--sheet-gold); font-size: 1.05rem; cursor: pointer; }
    .spell-expand[aria-expanded="true"] { transform: rotate(90deg); }
    .spell-detail { grid-column: 1 / -1; margin-top: 4px; padding: 7px 8px; border-left: 2px solid var(--sheet-gold); color: var(--sheet-muted); font-size: .78rem; line-height: 1.45; white-space: pre-wrap; }
    .spell-detail[hidden] { display: none; }
    .custom-input[hidden] { display: none; }
    .class-row { display: contents; }
    .class-row.hidden { display: none; }
    #identitySection > #classSection { gap: 12px; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
    #identitySection > #classSection .section-title { margin-top: 4px; }
    .subtle { margin: 0; color: var(--sheet-muted); font-size: .82rem; line-height: 1.45; }
    .button { min-height: 42px; border: 1px solid var(--sheet-line-strong); border-radius: 6px; padding: 9px 15px; background: var(--sheet-panel); color: var(--text); font: inherit; font-weight: 800; cursor: pointer; transition: background 160ms ease, border-color 160ms ease, transform 160ms ease; }
    .button:hover, .button:focus-visible { border-color: var(--sheet-gold); background: var(--sheet-panel-hover); transform: translateY(-1px); outline: none; }
    .button.primary { border-color: var(--sheet-gold); background: rgba(217,182,111,.18); color: var(--sheet-gold); }
    .button[aria-pressed="true"] { border-color: var(--sheet-gold); background: rgba(217,182,111,.25); color: var(--sheet-gold); }
    .button:disabled { cursor: not-allowed; opacity: .45; transform: none; }
    .class-actions { display: flex; align-items: end; }
    .class-actions .button { width: 100%; }
    .ability { padding: 12px 10px; border: 1px solid var(--sheet-line); border-radius: 6px; background: rgba(236,242,237,.05); text-align: center; }
    .ability .label { margin-bottom: 8px; color: var(--sheet-gold); }
    .ability select { text-align: center; font-size: 1.1rem; font-weight: 900; }
    .ability-total { display: block; margin-top: 4px; color: var(--text); font-size: 1.35rem; font-weight: 900; }
    .ability-bonus { color: var(--sheet-gold); font-weight: 900; }
    .ability-name { display: block; margin-top: 5px; color: var(--sheet-muted); font-size: .68rem; }
    .ability-mod { margin-top: 7px; color: var(--text); font-size: .95rem; font-weight: 900; }
    .save-line { display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 8px; color: var(--sheet-muted); font-size: .75rem; }
    .save-line input { width: auto; accent-color: var(--sheet-gold); }
    .save-value { min-width: 30px; color: var(--text); font-weight: 900; }
    .choice-row { display: flex; flex-wrap: wrap; gap: 9px; }
    .choice-row .button { flex: 1 1 100px; }
    .panel-box { padding: 13px; border: 1px solid var(--sheet-line); border-radius: 6px; background: rgba(236,242,237,.05); }
    .proficiency-groups { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .proficiency-group { min-width: 0; padding: 13px; border: 1px solid var(--sheet-line); border-radius: 6px; background: rgba(236,242,237,.05); }
    .subsection-title { margin: 0 0 10px; color: var(--sheet-gold); font-size: .85rem; }
    .proficiency-pills { display: flex; flex-wrap: wrap; gap: 7px; }
    .character-abilities { display: grid; gap: 12px; }
    .character-ability { padding: 12px 14px; border-bottom: 1px solid var(--sheet-line-strong); color: var(--sheet-muted); line-height: 1.55; white-space: pre-wrap; }
    .character-ability:last-of-type { border-bottom: 0; }
    .character-ability h3 { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin: 0 0 5px; color: var(--sheet-gold); font-size: .95rem; }
    .character-ability p { margin: 0; }
    .ability-markdown-table { width: 100%; margin: 8px 0; border-collapse: collapse; font-size: .78rem; }
    .ability-markdown-table th, .ability-markdown-table td { padding: 6px 8px; border: 1px solid var(--sheet-line); text-align: left; }
    .ability-markdown-table th { color: var(--sheet-gold); background: rgba(217,182,111,.08); }
    .equipment-picker { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
    .equipment-items { display: grid; gap: 7px; }
    .equipment-pill { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 9px; border: 1px solid var(--sheet-line-strong); border-radius: 999px; background: rgba(217,182,111,.12); color: var(--text); font-size: .78rem; font-weight: 800; }
    .equipment-pill span { flex: 1; min-width: 0; }
    .equipment-quantity { width: 74px; min-height: 28px; padding: 4px 7px; }
    .proficiency-pill { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 4px 9px; border: 1px solid var(--sheet-line-strong); border-radius: 999px; background: rgba(217,182,111,.12); color: var(--text); font-size: .75rem; font-weight: 800; }
    .proficiency-pill.add { border-style: dashed; background: transparent; color: var(--sheet-gold); cursor: pointer; }
    .proficiency-pill-remove { display: inline-grid; place-items: center; width: 17px; height: 17px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--sheet-muted); cursor: pointer; }
    .skill-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px 14px; }
    .check-field { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 7px; color: var(--sheet-muted); font-size: .86rem; }
    .check-field input, .save-line input { appearance: none; width: 19px; height: 19px; margin: 0; border: 2px solid var(--sheet-line-strong); border-radius: 50%; background: transparent; cursor: pointer; }
    .check-field input:checked, .save-line input:checked { border-color: var(--sheet-gold); background: var(--sheet-gold); box-shadow: inset 0 0 0 4px #173429; }
    .check-field input:checked + span { color: var(--sheet-gold); font-weight: 900; }
    .skill-value { color: var(--text); font-weight: 900; }
    .death-saves { display: grid; gap: 7px; }
    .death-track { display: flex; align-items: center; gap: 8px; color: var(--sheet-muted); font-size: .84rem; }
    .death-dot { position: relative; display: inline-flex; cursor: pointer; }
    .death-dot input { position: absolute; opacity: 0; pointer-events: none; }
    .death-dot span { width: 19px; height: 19px; display: block; border: 2px solid var(--sheet-line-strong); border-radius: 50%; }
    .death-dot input:checked + span { border-color: var(--sheet-gold); background: var(--sheet-gold); box-shadow: inset 0 0 0 4px #173429; }
    .bottom-actions { display: flex; justify-content: flex-end; gap: 10px; padding-top: 4px; }
    .locked { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: rgba(8,23,17,.84); color: var(--text); text-align: center; }
    .locked[hidden] { display: none; }
    .locked-card { width: min(460px, 100%); display: grid; gap: 14px; padding: 30px; border: 1px solid var(--sheet-line-strong); border-radius: 12px; background: #173429; box-shadow: 0 18px 45px rgba(0,0,0,.3); }
    .locked h2 { margin: 0 0 10px; color: var(--sheet-gold); }
    .locked p { margin: 0; color: var(--sheet-muted); line-height: 1.6; }
    .auth-entry { position: relative; z-index: 21; margin: 0 0 14px !important; }
    @media (max-width: 760px) { body { font-size: .92rem; } .page { width: calc(100% - 16px); padding: 76px 0 32px; gap: 20px; } .banner-img { width: min(260px, 72vw); } main { gap: 18px; } .hero { gap: 7px; } .hero h1 { font-size: clamp(1.7rem, 9vw, 2.6rem); } .sheet { gap: 14px; } .sheet-section { gap: 10px; padding: 12px; border-radius: 10px; } .section-title { font-size: 1.1rem; } .identity, .combat, .three, .adventure-grid, .wealth-grid, .alignment-grid { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(2, 1fr); } .class-grid { grid-template-columns: 1fr; } .class-row { display: grid; grid-template-columns: 1fr; gap: 10px; } .class-actions { grid-column: auto; } .expertise-grid { grid-template-columns: 1fr; } .portrait-grid { grid-template-columns: 120px minmax(0, 1fr); gap: 10px; } .portrait-preview { width: 120px; } .portrait-tools { grid-template-columns: 1fr; gap: 8px; } .portrait-controls { gap: 7px; } .portrait-controls .button { max-width: 100%; min-height: 30px; padding: 5px 7px; font-size: .7rem; } .portrait-controls input[type="url"] { width: 100%; min-height: 28px; } .portrait-crop { padding: 9px; } .skill-list { grid-template-columns: 1fr; gap: 6px; } .check-field { font-size: .8rem; } .death-track { font-size: .78rem; } .bottom-actions { position: sticky; bottom: 8px; z-index: 5; margin: 0 -4px; padding: 8px; border: 1px solid var(--sheet-line); border-radius: 10px; background: rgba(23,52,41,.94); } .bottom-actions .button { flex: 1; min-height: 40px; } .table-wrap { margin: 0; padding: 0; overflow: visible; } .sheet-table, .spell-table { min-width: 0; width: 100%; } .sheet-table thead { display: none; } .sheet-table tbody, .sheet-table tr, .sheet-table td { display: block; width: 100%; } .sheet-table tr { margin-bottom: 12px; padding: 7px; border: 1px solid var(--sheet-line); border-radius: 8px; background: rgba(236,242,237,.04); } .sheet-table td { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; align-items: center; padding: 5px 2px; border-top: 0; } .sheet-table td:first-child, .sheet-table th:first-child { width: 100%; } .sheet-table td::before { content: attr(data-label); color: var(--sheet-muted); font-size: .72rem; font-weight: 800; } .sheet-table td.attack-action-cell { display: flex; justify-content: flex-end; min-height: 30px; } .sheet-table td.attack-action-cell::before { display: none; } .weapon-cell { grid-template-columns: 58px minmax(0, 1fr); } .spell-table td:first-child, .spell-table th:first-child, .spell-table td:nth-child(2), .spell-table th:nth-child(2) { width: 100%; } }
    @media print { body { background: #fff; color: #17251f; } .page { width: 100%; padding: 0; } .language-toggle, .bottom-actions, .locked, .auth-entry, .hero p, .portrait-controls, .portrait-crop, .portrait-edit, .attack-table-actions, .attack-action-cell { display: none !important; } .banner-img { width: 260px; } .sheet-section { border-color: #b7c5bb; background: #fff; box-shadow: none; break-inside: avoid; } .section-title, .ability .label { color: #6b431d; } label, .label, .ability-name, .subtle, .save-line { color: #53645a; } input, select, textarea { border-color: #b7c5bb; background: #fff; color: #17251f; } select { color-scheme: light; } }
  </style>
  <style>@media (max-width: 760px) { .proficiency-groups { grid-template-columns: 1fr; } .mobile-table-add { display: flex; } .armor-loadout-row { grid-template-columns: 1fr; gap: 5px; } }</style>

<body>
  <div class="language-toggle" role="group" aria-label="Language"><button id="languageButton" type="button" data-lang="zh" aria-pressed="true" aria-label="目前語言：中文" data-lang-toggle></button></div>
  <div class="page" id="characterSheetPage">
    <header class="banner"><a class="banner-link" href="../../index.html" aria-label="Rugatha home"><img src="../../assets/banner/rugatha-banner-trademark.png" alt="Rugatha" class="banner-img"></a></header>
    <main>
      <section class="hero" aria-labelledby="pageTitle"><h1 id="pageTitle" data-i18n="title">D&amp;D 5e 角色卡</h1><p data-i18n="subtitle">建立並保存你的玩家角色資料。</p></section>
      <form class="sheet" id="characterSheet">

        portraitFlip = data.portraitFlip === true;
        attackRowCount = Math.max(1, Number(data.attackRowCount) || 1);
        attackCustomRows = data.attackCustomRows || {};
        spellRowCount = Math.max(1, Number(data.spellRowCount) || 1);
        renderAttackRows();
        renderSpellRows();
        document.querySelectorAll('#characterSheet input, #characterSheet select, #characterSheet textarea').forEach((el) => {
          if (!(el.id in data)) return;
          if (el.type === 'checkbox') el.checked = Boolean(data[el.id]);
          else if (el.multiple) Array.from(el.options).forEach((option) => { option.selected = Array.isArray(data[el.id]) && data[el.id].includes(option.value); });
          else if (el.classList.contains('level-select')) el.value = data[el.id] || '1';
          else el.value = data[el.id];
        });
      } catch (_) {}
      if (!document.getElementById('level1').value) document.getElementById('level1').value = '1';
      if (!document.getElementById('level2').value) document.getElementById('level2').value = '1';
      applyPortraitPosition();
      Object.keys(attackCustomRows).forEach((index) => applyAttackMode(index));
      document.querySelector('[data-class-row="2"]').classList.toggle('hidden', !multiclass);
      document.getElementById('multiclassButton').setAttribute('aria-pressed', String(multiclass));
      renderSubclassOptions(1);
      renderSubclassOptions(2);
      showCustom(document.getElementById('background'), document.getElementById('backgroundOther'));
      showCustom(document.getElementById('race'), document.getElementById('raceOther'));
      showCustom(document.getElementById('class1'), document.getElementById('class1Other'));
      showCustom(document.getElementById('class2'), document.getElementById('class2Other'));
      if (portraitSrc) setPortrait(portraitSrc);
      syncInspiration();
      updateSaves();
      renderProficiencyPills();
      renderCharacterAbilities();
      renderEquipmentItems();
      updateAllAttacks();
      updateLevels();
      updateSpellSummary();
    };
    document.getElementById('languageButton').addEventListener('click', () => setLanguage(currentLanguage === 'zh' ? 'en' : 'zh'));
    document.getElementById('multiclassButton').addEventListener('click', () => { multiclass = true; document.querySelector('[data-class-row="2"]').classList.remove('hidden'); document.getElementById('level2').value = '1'; document.getElementById('multiclassButton').setAttribute('aria-pressed', 'true'); updateLevels(); save(); });
    document.getElementById('removeMulticlassButton').addEventListener('click', () => { multiclass = false; document.querySelector('[data-class-row="2"]').classList.add('hidden'); document.getElementById('class2').value = ''; document.getElementById('class2Other').value = ''; document.getElementById('level2').value = ''; document.getElementById('class2Other').hidden = true; document.getElementById('multiclassButton').setAttribute('aria-pressed', 'false'); updateLevels(); save(); });
    document.addEventListener('change', (event) => { if (event.target.matches('.class-select')) { renderOptions(); showCustom(event.target, document.getElementById(`${event.target.id}Other`)); renderSubclassOptions(event.target.id.replace('class', '')); if (event.target.value && event.target.value !== 'other') loadSubclassOptions(); renderCharacterAbilities(); updateHitDice(); updateSpellRows(); updateSpellSummary(); renderProficiencyPills(); updateAllAttacks(); } if (event.target.id === 'race' || event.target.id === 'background' || event.target.id === 'feat') { if (event.target.id === 'background') showCustom(event.target, document.getElementById('backgroundOther')); if (event.target.id === 'race') showCustom(event.target, document.getElementById('raceOther')); renderCharacterAbilities(); renderProficiencyPills(); updateSpellRows(); updateSaves(); updateCombatAuto(); } if (event.target.matches('.level-select')) { renderSubclassOptions(event.target.id.replace('level', '')); if (document.getElementById(`class${event.target.id.replace('level', '')}`).value) loadSubclassOptions(); renderCharacterAbilities(); updateLevels(); updateSpellSummary(); } if (event.target.id === 'proficiency') { updateSaves(); updateAllAttacks(); } if (event.target.id === 'equipmentSelect') renderEquipmentOptions(); if (event.target.id === 'armorChoice' || event.target.id === 'shieldChoice') { syncShieldEditor(); updateArmorClass(); } save(); });
    document.addEventListener('input', scheduleSave);
    document.getElementById('inspirationButton').addEventListener('click', () => { const input = document.getElementById('inspiration'); input.value = input.value === 'yes' ? 'no' : 'yes'; syncInspiration(); save(); });
    document.getElementById('portraitFile').addEventListener('change', (event) => { const file = event.target.files?.[0]; if (!file) return; const reader = new FileReader(); reader.addEventListener('load', () => setPortrait(reader.result)); reader.readAsDataURL(file); });
    document.getElementById('portraitUrlButton').addEventListener('click', () => { const url = document.getElementById('portraitUrl').value.trim(); if (url) setPortrait(url); });
    document.getElementById('portraitRemoveButton').addEventListener('click', removePortrait);
    let portraitDrag = null;
    document.getElementById('portraitImage').addEventListener('pointerdown', (event) => { if (!portraitSrc) return; portraitDrag = { x: event.clientX, y: event.clientY, startX: portraitPosition.x, startY: portraitPosition.y }; event.currentTarget.setPointerCapture(event.pointerId); event.currentTarget.classList.add('is-dragging'); });
    document.getElementById('portraitImage').addEventListener('pointermove', (event) => { if (!portraitDrag) return; const preview = document.getElementById('portraitPreview'); portraitPosition.x = Math.max(0, Math.min(100, portraitDrag.startX + ((event.clientX - portraitDrag.x) / preview.clientWidth) * 100)); portraitPosition.y = Math.max(0, Math.min(100, portraitDrag.startY + ((event.clientY - portraitDrag.y) / preview.clientHeight) * 100)); applyPortraitPosition(); });
    document.getElementById('portraitImage').addEventListener('pointerup', (event) => { if (!portraitDrag) return; portraitDrag = null; event.currentTarget.classList.remove('is-dragging'); save(); });
    document.getElementById('portraitImage').addEventListener('pointercancel', (event) => { portraitDrag = null; event.currentTarget.classList.remove('is-dragging'); });
    document.getElementById('portraitZoom').addEventListener('input', (event) => { portraitZoom = Number(event.target.value) || 1; applyPortraitPosition(); save(); });
    document.getElementById('portraitCropX').addEventListener('input', (event) => { portraitPosition.x = Number(event.target.value); applyPortraitPosition(); save(); });
    document.getElementById('portraitCropY').addEventListener('input', (event) => { portraitPosition.y = Number(event.target.value); applyPortraitPosition(); save(); });
    document.getElementById('portraitFlipButton').addEventListener('click', () => { portraitFlip = !portraitFlip; applyPortraitPosition(); save(); });
    document.getElementById('armorChoice').addEventListener('change', updateArmorClass);
    document.getElementById('armorWorn').addEventListener('change', () => { updateArmorClass(); save(); });
    document.getElementById('shieldWorn').addEventListener('change', () => { updateArmorClass(); save(); });
    document.getElementById('shieldCustomAC').addEventListener('change', () => { updateArmorClass(); save(); });
    document.getElementById('shieldChoice').addEventListener('change', () => { syncShieldEditor(); updateArmorClass(); save(); });
    document.getElementById('equipmentSelect').addEventListener('focus', loadEquipmentOptions, { once: true });
    document.getElementById('addEquipmentButton').addEventListener('click', async () => { await loadEquipmentOptions(); const id = document.getElementById('equipmentSelect').value; if (!id) return; if (id === 'other') { const name = window.prompt(currentLanguage === 'zh' ? '請輸入裝備名稱' : 'Enter equipment name'); if (name?.trim()) equipmentItems.push({ id: `custom:${Date.now()}`, nameZh: name.trim(), nameEn: name.trim(), quantity: 1 }); } else { const item = window.sheetOptions?.equipment?.find((option) => option.id === id); const additions = item?.type === 'pack' ? item.contents || [] : [item]; additions.forEach((addition) => { if (!addition) return; const existing = equipmentItems.find((entry) => entry.id === addition.id); if (existing) existing.quantity = Number(existing.quantity || 0) + Number(addition.quantity || 1); else equipmentItems.push({ id: addition.id, nameZh: addition.nameZh, nameEn: addition.nameEn, quantity: Number(addition.quantity || 1) }); }); } document.getElementById('equipmentSelect').value = ''; renderEquipmentItems(); save(); });
    document.getElementById('addAttackButton').addEventListener('click', () => resizeAttackRows(attackRowCount + 1));
    document.getElementById('mobileAddAttackButton').addEventListener('click', () => resizeAttackRows(attackRowCount + 1));
    const addSpellRow = async () => { await loadSpellOptions(); resizeSpellRows(spellRowCount + 1); };
    document.getElementById('addSpellButton').addEventListener('click', addSpellRow);
    document.getElementById('mobileAddSpellButton').addEventListener('click', addSpellRow);
    document.getElementById('spellRows').closest('.sheet-section').addEventListener('focusin', loadSpellOptions, { once: true });
    document.getElementById('resetButton').addEventListener('click', () => { if (!authenticated || !window.confirm(currentLanguage === 'zh' ? '確定要清除全部內容嗎？' : 'Clear all entries?')) return; document.getElementById('characterSheet').reset(); attackRowCount = 1; attackCustomRows = {}; spellRowCount = 1; customProficiencies = { skill: [], lan: [], tool: [] }; removedProficiencies = { skill: [], lan: [], tool: [], save: [] }; customAbilities = []; removedAbilities = []; equipmentItems = []; renderAttackRows(); renderSpellRows(); multiclass = false; removePortrait(); document.querySelector('[data-class-row="2"]').classList.add('hidden'); document.getElementById('multiclassButton').setAttribute('aria-pressed', 'false'); document.querySelectorAll('.custom-input').forEach((input) => { input.value = ''; input.hidden = true; }); renderSubclassOptions(1); renderSubclassOptions(2); renderEquipmentItems(); syncInspiration(); updateSaves(); renderProficiencyPills(); renderCharacterAbilities(); updateLevels(); updateSpellSummary(); save(); });
    const initializeSheet = () => { document.getElementById('identitySection').append(document.getElementById('classSection')); document.getElementById('proficiencySection').before(document.getElementById('skillsSection')); setLanguage(localStorage.getItem('rugatha-language') || 'zh'); initialized = true; updateGate(); document.getElementById('characterSheetPage').classList.add('is-authorized'); (window.requestIdleCallback || ((callback) => window.setTimeout(callback, 0)))(loadOptions, { timeout: 1000 }); };
    window.addEventListener('rugatha-character-sheet-authorized', initializeSheet, { once: true });
  </script>
  <script src="../../shared/firebase.config.js"></script>
  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

    const config = window.RUGATHA_FIREBASE_CONFIG;
    if (config && !(window.RUGATHA_FEATURE_FLAGS && window.RUGATHA_FEATURE_FLAGS.firebaseEnabled === false)) {
      const app = getApps().length ? getApps()[0] : initializeApp(config);
      onAuthStateChanged(getAuth(app), (user) => {
        if (user?.email?.toLowerCase() === 'rugathadnd@gmail.com') {
          window.dispatchEvent(new Event('rugatha-character-sheet-authorized'));
        }
      });
    }
  </script>
