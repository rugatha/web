<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BZZFKMJ65Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BZZFKMJ65Y', { page_title: 'D&D 專長 | Rugatha', page_path: window.location.pathname, page_location: window.location.href });
    gtag('event', 'tool_page_view', { tool_name: 'feat', page_path: window.location.pathname, page_title: 'D&D 專長 | Rugatha' });
  </script>
  <title>D&amp;D 專長 | Rugatha</title>
  <link rel="icon" type="image/png" href="../../assets/logo/rugatha-favicon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/logo/rugatha-favicon-32.png">
  <link rel="stylesheet" href="../../shared/styles/theme.css">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../assets/logo/rugatha-icon-192.png">
  <script defer src="../../shared/pwa.js"></script>
  <script src="../../shared/language-toggle.js"></script>
  <style>
    :root { --line: rgba(236,242,237,.2); --line-strong: rgba(236,242,237,.42); --panel: rgba(236,242,237,.08); --panel-hover: rgba(236,242,237,.14); --muted: rgba(236,242,237,.72); --gold: #d9b66f; }
    body { min-height:100vh; background:var(--bg); color:var(--text); }
    .page { width:min(920px,calc(100vw - 32px)); min-height:100vh; margin:0 auto; padding:28px 0 64px; display:grid; align-content:start; gap:34px; }
    .language-toggle { position:fixed; top:16px; left:16px; z-index:10; display:inline-flex; }
    .language-toggle button { width:72px; height:72px; display:grid; place-items:center; padding:0; border:0; border-radius:50%; background:transparent; cursor:pointer; transition:opacity 160ms ease,transform 160ms ease; }
    .language-toggle button:hover,.language-toggle button:focus-visible { opacity:.86; transform:translateY(-1px); outline:none; }
    .language-toggle__icon { width:100%; height:100%; display:block; object-fit:contain; }
    .banner { display:flex; justify-content:center; } .banner-link { display:inline-flex; } .banner-img { width:min(360px,78vw); height:auto; display:block; }
    main { display:grid; gap:28px; } .hero { display:grid; justify-items:center; gap:10px; text-align:center; }
    .hero h1 { margin:0; font-size:clamp(2rem,6vw,4rem); line-height:1; } .hero p { max-width:680px; margin:0; color:var(--muted); line-height:1.55; }
    .feat-list { display:grid; gap:12px; margin:0; padding:0; list-style:none; }
    .filters { display:grid; gap:14px; padding:18px; border:1px solid var(--line); border-radius:8px; background:rgba(236,242,237,.06); }
    .filter-toggle { width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0; border:0; background:transparent; color:var(--text); font:inherit; font-size:clamp(1.2rem,2vw,1.55rem); font-weight:700; line-height:1.1; text-align:left; cursor:pointer; } .filter-toggle::after { content:'▾'; color:var(--gold); font-size:.95rem; transition:transform 160ms ease; } .filter-toggle[aria-expanded="true"]::after { transform:rotate(180deg); }
    .filter-content { display:grid; gap:14px; } .filter-content[hidden] { display:none; }
    .filter-groups { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
    .filter-group { display:grid; gap:9px; min-width:0; } .filter-title { color:var(--gold); font-weight:700; }
    .filter-options { display:flex; flex-wrap:wrap; gap:8px; } .filter-option { display:inline-flex; align-items:center; gap:6px; padding:6px 9px; border:1px solid var(--line); border-radius:999px; color:var(--muted); cursor:pointer; font-size:.9rem; }
    .filter-option:has(input:checked) { border-color:var(--gold); background:rgba(217,182,111,.16); color:var(--text); } .filter-option input { accent-color:var(--gold); }
    .clear-filters { justify-self:start; padding:8px 12px; border:1px solid var(--line-strong); border-radius:6px; background:transparent; color:var(--text); font:inherit; cursor:pointer; } .clear-filters:hover,.clear-filters:focus-visible { border-color:var(--gold); outline:none; }
    .feat-card { width:100%; min-height:80px; display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:18px; padding:18px 22px; border:1px solid var(--line); border-radius:8px; background:linear-gradient(135deg,rgba(217,182,111,.12),transparent 34%),var(--panel); color:var(--text); font:inherit; text-align:left; box-shadow:0 14px 38px rgba(0,0,0,.16); transition:transform 160ms ease,border-color 160ms ease,background 160ms ease; }
    .feat-card:not([aria-disabled="true"]) { cursor:pointer; } .feat-card:not([aria-disabled="true"]):hover,.feat-card:not([aria-disabled="true"]):focus-visible { transform:translateX(4px); border-color:var(--line-strong); background:linear-gradient(135deg,rgba(217,182,111,.18),transparent 38%),var(--panel-hover); outline:none; } .feat-card[aria-disabled="true"] { cursor:default; }
    .feat-mark { width:48px; height:48px; display:grid; place-items:center; } .feat-mark img { width:42px; height:42px; object-fit:contain; filter:brightness(.7); } .feat-name { font-size:clamp(1.2rem,2vw,1.55rem); font-weight:700; line-height:1.1; }
    .expand-icon { color:var(--gold); font-size:1.25rem; transition:transform 160ms ease; } .feat-card[aria-expanded="true"] .expand-icon { transform:rotate(45deg); }
    .feat-details { display:grid; gap:18px; margin:8px 0 2px 66px; padding:16px 18px; border:1px solid var(--line); border-radius:8px; background:rgba(236,242,237,.06); } .detail { display:grid; gap:6px; } .detail-label { color:var(--gold); font-size:.82rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; } .detail-value { line-height:1.55; } .locked-note { margin:0; color:var(--muted); font-size:.9rem; text-align:center; }
    @media (max-width:640px) { .page { width:min(100% - 24px,920px); padding-top:72px; } .language-toggle { top:8px; left:8px; } .language-toggle button { width:58px; height:58px; } .filter-groups { grid-template-columns:1fr; } .feat-card { gap:12px; padding:16px; } .feat-mark { width:38px; height:38px; } .feat-mark img { width:34px; height:34px; } .feat-details { margin-left:0; } }
  </style>
</head>
<body>
  <div class="language-toggle" role="group" aria-label="Language"><button type="button" data-lang="zh" aria-pressed="true" aria-label="目前語言：中文" data-lang-toggle></button></div>
  <div class="page">
    <header class="banner"><a class="banner-link" href="../../index.html" aria-label="Rugatha home"><img src="../../assets/banner/rugatha-banner-trademark.png" alt="Rugatha banner" class="banner-img"></a></header>
    <main>
      <section class="hero" aria-labelledby="page-title"><h1 id="page-title" data-i18n="title">D&amp;D 專長</h1></section>
      <section class="filters" aria-label="Feat filters">
        <button class="filter-toggle" type="button" id="filterToggle" aria-expanded="false" aria-controls="filterContent"><span data-i18n="filters">篩選</span></button>
        <div class="filter-content" id="filterContent" hidden>
          <div class="filter-groups"><div class="filter-group"><span class="filter-title" data-i18n="prerequisite">先決條件</span><div class="filter-options" id="prerequisiteFilters"></div></div><div class="filter-group"><span class="filter-title" data-i18n="rules">設定摘要</span><div class="filter-options" id="summaryFilters"></div></div></div>
          <button class="clear-filters" type="button" id="clearFilters" data-i18n="clearFilters">清除篩選</button>
        </div>
      </section>
      <p class="locked-note" id="lockedNote" data-i18n="locked">登入後可點選專長查看詳細設定。</p>
      <ul class="feat-list" id="featList" aria-live="polite"></ul>
    </main>
  </div>
  <script>
    const translations = {
      zh: { browserTitle:'D&D 專長 | Rugatha', title:'D&D 專長', subtitle:'D&D 5e 玩家手冊（2014）專長：先決條件與規則摘要。', filters:'篩選', locked:'登入後可點選專長查看詳細設定。', prerequisite:'先決條件', rules:'設定摘要', none:'無', other:'其他', clearFilters:'清除篩選', noResults:'沒有符合篩選條件的專長。', loadError:'無法載入專長資料。', aria:'目前語言：中文' },
      en: { browserTitle:'D&D Feats | Rugatha', title:'D&D Feats', subtitle:'D&D 5e Player’s Handbook (2014) feats: prerequisites and concise rules summaries.', filters:'Filters', locked:'Sign in to select a feat and view its details.', prerequisite:'Prerequisite', rules:'Rules summary', none:'None', other:'Other', clearFilters:'Clear filters', noResults:'No feats match the selected filters.', loadError:'Unable to load feat data.', aria:'Current language: English' }
    };
    let feats = [], dataLoadError = false, currentLanguage = 'zh', expandedId = null;
    let isAuthenticated = window.RUGATHA_AUTH_SIGNED_IN === true;
    const languageButton = document.querySelector('[data-lang-toggle]');
    const list = document.getElementById('featList'); const lockedNote = document.getElementById('lockedNote'); const filterToggle = document.getElementById('filterToggle'); const filterContent = document.getElementById('filterContent'); const prerequisiteFilters = document.getElementById('prerequisiteFilters'); const summaryFilters = document.getElementById('summaryFilters'); const clearFiltersButton = document.getElementById('clearFilters'); const storageKey = 'rugatha-language';
    const abilityFilters = [['str','力量','Strength'],['dex','敏捷','Dexterity'],['con','體質','Constitution'],['int','智力','Intelligence'],['wis','感知','Wisdom'],['cha','魅力','Charisma']];
    const selectedPrerequisites = new Set(); const selectedSummaries = new Set();
    const summaryTags = {
      actor:['cha'], athlete:['str','dex'], 'defensive-duelist':['dex'], durable:['con'], 'heavily-armored':['str'], 'heavy-armor-master':['str'], 'inspiring-leader':['cha'], 'keen-mind':['int'], 'lightly-armored':['str','dex'], linguist:['int'], 'medium-armor-master':['dex'], 'moderately-armored':['str','dex'], observant:['int','wis'], resilient:['str','dex','con','int','wis','cha'], 'ritual-caster':['int','wis'], 'tavern-brawler':['str','con'], 'weapon-master':['str','dex']
    };
    const storedLanguage = () => { try { return localStorage.getItem(storageKey); } catch (error) { return null; } };
    const addDetail = (parent, label, value) => { const detail=document.createElement('div'); detail.className='detail'; const heading=document.createElement('span'); heading.className='detail-label'; heading.textContent=label; const text=document.createElement('span'); text.className='detail-value'; text.textContent=value; detail.append(heading,text); parent.append(detail); };
    const getPrerequisiteTags = (feat) => {
      if (feat.prerequisite_en === 'None') return ['none'];
      const text = feat.prerequisite_en.toLowerCase();
      return abilityFilters.filter(([key,,english]) => text.includes(english.toLowerCase())).map(([key]) => key);
    };
    const hasSelectedTag = (tags, selected) => !selected.size || tags.some((tag) => selected.has(tag));
    const renderFilterOptions = (host, options, selected, group) => {
      const copy = translations[currentLanguage]; host.replaceChildren(...options.map(([key, zh, en]) => {
        const label = document.createElement('label'); label.className='filter-option'; const input=document.createElement('input'); input.type='checkbox'; input.value=key; input.checked=selected.has(key);
        input.addEventListener('change', () => { input.checked ? selected.add(key) : selected.delete(key); expandedId=null; render(); });
        const text=document.createElement('span'); text.textContent=currentLanguage==='zh' ? zh : en; label.append(input,text); return label;
      }));
    };
    const renderFilters = () => {
      const copy = translations[currentLanguage];
      renderFilterOptions(prerequisiteFilters, [...abilityFilters, ['none',copy.none,copy.none]], selectedPrerequisites, 'prerequisite');
      renderFilterOptions(summaryFilters, [...abilityFilters, ['other',copy.other,copy.other]], selectedSummaries, 'summary');
      clearFiltersButton.textContent=copy.clearFilters;
    };
    const render = () => {
      const copy = translations[currentLanguage]; lockedNote.hidden = isAuthenticated;
      renderFilters();
      if (dataLoadError) { const error=document.createElement('li'); error.className='locked-note'; error.textContent=copy.loadError; list.replaceChildren(error); return; }
      const filteredFeats = feats.map((feat, index) => ({ feat, index })).filter(({ feat }) => {
        const featSummaryTags = summaryTags[feat.id] || ['other'];
        return hasSelectedTag(getPrerequisiteTags(feat), selectedPrerequisites) && hasSelectedTag(featSummaryTags, selectedSummaries);
      });
      if (!filteredFeats.length) { const noResults=document.createElement('li'); noResults.className='locked-note'; noResults.textContent=copy.noResults; list.replaceChildren(noResults); return; }
      list.replaceChildren(...filteredFeats.map(({ feat, index }) => {
        const expanded = isAuthenticated && expandedId === index; const item=document.createElement('li'); const button=document.createElement('button');
        button.className='feat-card'; button.type='button'; button.setAttribute('aria-expanded',String(expanded)); button.setAttribute('aria-disabled',String(!isAuthenticated));
        button.innerHTML=`<span class="feat-mark" aria-hidden="true"><img src="../../assets/logo/D&amp;D_logo.png" alt=""></span><span class="feat-name">${feat[`name_${currentLanguage}`]}</span>${isAuthenticated ? '<span class="expand-icon" aria-hidden="true">+</span>' : ''}`;
        button.addEventListener('click', () => { if (!isAuthenticated) return; expandedId = expanded ? null : index; render(); }); item.append(button);
        if (expanded) { const details=document.createElement('div'); details.className='feat-details'; addDetail(details,copy.prerequisite,feat[`prerequisite_${currentLanguage}`]); addDetail(details,copy.rules,feat[`summary_${currentLanguage}`]); item.append(details); }
        return item;
      }));
    };
    const loadFeats = async () => { try { const response=await fetch('feat-data.json'); if (!response.ok) throw new Error(`Failed to load feat data: ${response.status}`); const data=await response.json(); if (!Array.isArray(data)) throw new Error('Feat data must be an array.'); feats=data; } catch (error) { dataLoadError=true; console.error('Failed to load feat data',error); } render(); };
    const setLanguage = (language) => { currentLanguage=language==='en'?'en':'zh'; const copy=translations[currentLanguage]; document.documentElement.lang=currentLanguage==='zh'?'zh-Hant':'en'; document.body.dataset.lang=currentLanguage; document.title=copy.browserTitle; document.querySelectorAll('[data-i18n]').forEach((element)=>{element.textContent=copy[element.dataset.i18n];}); languageButton.dataset.lang=currentLanguage; languageButton.setAttribute('aria-label',copy.aria); if (window.RugathaLanguageToggle) window.RugathaLanguageToggle.setButtonIcon(languageButton,currentLanguage); try { localStorage.setItem(storageKey,currentLanguage); } catch (error) {} render(); };
    languageButton.addEventListener('click',()=>setLanguage(currentLanguage==='en'?'zh':'en'));
    filterToggle.addEventListener('click', () => { const isOpen = filterToggle.getAttribute('aria-expanded') === 'true'; filterToggle.setAttribute('aria-expanded', String(!isOpen)); filterContent.hidden = isOpen; });
    clearFiltersButton.addEventListener('click', () => { selectedPrerequisites.clear(); selectedSummaries.clear(); expandedId=null; render(); });
    window.addEventListener('rugatha:auth-state-changed',(event)=>{isAuthenticated=event.detail?.signedIn===true; if (!isAuthenticated) expandedId=null; render();});
    setLanguage(storedLanguage() || 'zh'); loadFeats();
  </script>
  <script src="../../shared/rugatha.config.js"></script>
  <script src="../../shared/firebase.config.js"></script>
  <script type="module" src="../../shared/auth.js"></script>
</body>
</html>
